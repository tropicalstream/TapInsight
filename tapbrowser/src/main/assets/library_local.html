<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Media Library</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;color:#e0e0e0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

  /* ── Layout ────────────────────────────────────────── */
  #app{display:flex;flex-direction:column;height:100%}
  header{
    flex-shrink:0;padding:10px 14px 8px;border-bottom:1px solid #0a2a3a;
    background:linear-gradient(180deg,#071320 0%,#030709 100%);
    display:flex;align-items:center;gap:10px;
  }
  header .logo{
    width:28px;height:28px;border-radius:7px;flex-shrink:0;
    background:linear-gradient(160deg,#112233,#061018);
    border:1px solid #00e5ff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 10px rgba(0,229,255,.18);
  }
  header .title{flex:1;min-width:0}
  header h1{font-size:14px;color:#00e5ff;letter-spacing:.3px;font-weight:700;line-height:1.1}
  header .sub{font-size:10px;color:#6a8594;letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
  header .tools{display:flex;gap:6px}
  header .tool-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid #0a2a3a;
    background:#04131c;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:#b8d6e2;transition:all .15s;
  }
  header .tool-btn:hover{border-color:#00e5ff;color:#fff;background:rgba(0,229,255,.08)}
  header .tool-btn:disabled{opacity:.35;cursor:not-allowed}

  nav.crumbs{
    flex-shrink:0;padding:8px 14px;border-bottom:1px solid #0a1e2a;
    background:#020a0f;font-size:12px;color:#6a8594;
    display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;
  }
  nav.crumbs::-webkit-scrollbar{display:none}
  nav.crumbs .crumb{color:#8cb8cc;cursor:pointer;padding:2px 4px;border-radius:4px}
  nav.crumbs .crumb:hover{color:#00e5ff;background:rgba(0,229,255,.08)}
  nav.crumbs .crumb.active{color:#e0e0e0;cursor:default}
  nav.crumbs .sep{color:#3a5f73}

  main{flex:1;overflow-y:auto;padding-bottom:24px;-webkit-overflow-scrolling:touch}
  main::-webkit-scrollbar{width:6px}
  main::-webkit-scrollbar-track{background:transparent}
  main::-webkit-scrollbar-thumb{background:#14364a;border-radius:3px}

  .entry{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-bottom:1px solid #071825;cursor:pointer;transition:background .12s;
  }
  .entry:hover,.entry:focus{background:#071421;outline:none}
  .entry .ic{
    width:34px;height:34px;border-radius:8px;flex-shrink:0;
    background:#04131c;border:1px solid #0a2a3a;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#b8d6e2;
  }
  .entry.folder .ic{color:#ffd57c;border-color:#4a3b1c}
  .entry.audio  .ic{color:#7cffda;border-color:#1c4a3c}
  .entry.video  .ic{color:#b08cff;border-color:#3a1c4a}
  .entry.playlist .ic{color:#00e5ff;border-color:#1c3a4a}
  .entry .txt{flex:1;min-width:0}
  .entry .name{font-size:14px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .meta{font-size:11px;color:#6a8594;margin-top:2px}
  .entry .arrow{color:#3a5f73;font-size:16px;flex-shrink:0}
  .entry .del{
    width:28px;height:28px;border-radius:6px;border:1px solid #331515;color:#ff7676;
    font-size:12px;display:none;align-items:center;justify-content:center;flex-shrink:0;
  }
  .entry.playlist .del,.entry.audio .del,.entry.video .del{display:flex}
  .entry .del:hover{background:#4a1a1a;color:#fff}

  .empty{
    padding:48px 24px;text-align:center;color:#6a8594;font-size:13.5px;line-height:1.6;
  }
  .empty .big{font-size:36px;opacity:.5;margin-bottom:10px}
  .empty code{color:#00e5ff;font-family:ui-monospace,'SF Mono',Menlo,monospace;
    background:#02090d;padding:1px 6px;border-radius:4px;border:1px solid #0a2a3a;font-size:12px}

  /* ── Play All bar (playlist view) ──────────────────── */
  .playall-bar{
    padding:10px 14px 6px;position:sticky;top:0;
    background:linear-gradient(180deg,#020a0f 0%,rgba(2,10,15,.9) 100%);
    z-index:2;backdrop-filter:blur(4px);
    border-bottom:1px solid #071825;
  }
  .playall{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:10px;
    background:linear-gradient(135deg,#052636 0%,#072a3a 100%);
    border:1px solid #00e5ff;
    color:#e0ffff;font-size:14px;font-weight:600;letter-spacing:.3px;
    box-shadow:0 0 12px rgba(0,229,255,.18);
    transition:all .15s;
  }
  .playall:hover{background:linear-gradient(135deg,#063449 0%,#083a52 100%);
    box-shadow:0 0 18px rgba(0,229,255,.28)}
  .playall:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .playall .ico{
    width:28px;height:28px;border-radius:50%;background:#00e5ff;color:#031018;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;flex-shrink:0;
  }
  .playall .lbl{flex:1;text-align:left}
  .playall .ct{font-size:11.5px;color:#7ed6e8;font-weight:500;letter-spacing:.4px}

  /* ── Toast ─────────────────────────────────────────── */
  #toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:#041b29;border:1px solid #00e5ff;color:#e0e0e0;padding:10px 14px;
    border-radius:8px;font-size:12.5px;box-shadow:0 4px 20px rgba(0,229,255,.25);
    opacity:0;pointer-events:none;transition:all .22s;z-index:10;max-width:80vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{border-color:#b71c1c;color:#ffb3b3;box-shadow:0 4px 20px rgba(183,28,28,.3)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="18" height="18">
        <rect x="10" y="16" width="28" height="4" rx="2" fill="#00e5ff"/>
        <rect x="10" y="28" width="24" height="4" rx="2" fill="#00e5ff" opacity=".7"/>
        <rect x="10" y="40" width="20" height="4" rx="2" fill="#00e5ff" opacity=".45"/>
        <circle cx="47" cy="43" r="12" fill="#00e5ff"/>
        <polygon points="43,36 43,50 55,43" fill="#061018"/>
      </svg>
    </div>
    <div class="title">
      <h1>Media Library</h1>
      <div class="sub" id="headerSub">On-Device</div>
    </div>
    <div class="tools">
      <button class="tool-btn" id="btnGenPlaylist" title="Create playlist from current folder">＋</button>
      <button class="tool-btn" id="btnRefresh" title="Refresh">↻</button>
      <a class="tool-btn" href="file:///android_asset/AR_Dashboard_Landscape_Sidebar.html" title="Back to dashboard">⌂</a>
    </div>
  </header>

  <nav class="crumbs" id="crumbs"></nav>

  <main id="main">
    <div class="empty" id="loading">
      <div class="big">⋯</div>
      <div>Loading library…</div>
    </div>
  </main>
</div>

<!-- Playback is handed off to media_player.html (same page the browser uses
     for any tapped audio/video URL), so this file has no inline player. -->

<div id="toast"></div>

<script>
(function(){
  'use strict';

  // ── Bridge accessor ─────────────────────────────────────────────────
  // window.TapMedia is injected by MediaLibraryBridge.kt when this page
  // is loaded from an on-glasses origin (either file:///android_asset/...
  // or https://appassets.androidplatform.net/assets/...). If the bridge
  // is missing we're either on the wrong page or it didn't wire up, and
  // every call returns a friendly error instead of crashing.
  var TM = window.TapMedia;
  function bridgeMissing(){
    return !TM || typeof TM.listFolder !== 'function';
  }
  function callBridge(method, args){
    try { return JSON.parse(TM[method].apply(TM, args || [])); }
    catch (e) { return { error: String(e && e.message || e) }; }
  }

  // ── DOM refs ────────────────────────────────────────────────────────
  var $main      = document.getElementById('main');
  var $crumbs    = document.getElementById('crumbs');
  var $subTitle  = document.getElementById('headerSub');
  var $btnGen    = document.getElementById('btnGenPlaylist');
  var $btnRefresh= document.getElementById('btnRefresh');

  var $toast     = document.getElementById('toast');

  // ── State ──────────────────────────────────────────────────────────
  var state = {
    mode: 'folder',     // 'folder' | 'playlist'
    currentFolder: '',  // relative path
    folderEntries: [],  // for folder mode
    playlistName: '',
    playlistPath: '',
    playlistEntries: [] // for playlist mode
  };

  // ── Toast ──────────────────────────────────────────────────────────
  var toastTimer = null;
  function toast(msg, isErr){
    $toast.textContent = msg;
    $toast.classList.toggle('err', !!isErr);
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ $toast.classList.remove('show'); }, 2400);
  }

  // ── Formatting ─────────────────────────────────────────────────────
  function humanSize(bytes){
    if (bytes == null || bytes <= 0) return '';
    var u = ['B','KB','MB','GB'], i = 0, n = bytes;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
  }
  function humanTime(sec){
    if (!isFinite(sec) || sec < 0) return '0:00';
    sec = Math.floor(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fileIcon(kind, name){
    switch (kind) {
      case 'FOLDER'  : return '📁';
      case 'AUDIO'   : return '♪';
      case 'VIDEO'   : return '▶';
      case 'PLAYLIST': return '≡';
      case 'TEXT'    : return '📄';
      default        : return '·';
    }
  }

  // ── Breadcrumbs ────────────────────────────────────────────────────
  function renderCrumbs(crumbs){
    $crumbs.innerHTML = '';
    if (!crumbs || !crumbs.length) return;
    crumbs.forEach(function(c, i){
      if (i > 0) {
        var sep = document.createElement('span');
        sep.className = 'sep'; sep.textContent = '›';
        $crumbs.appendChild(sep);
      }
      var el = document.createElement('span');
      el.className = 'crumb' + (i === crumbs.length - 1 && state.mode === 'folder' ? ' active' : '');
      el.textContent = c.name;
      el.addEventListener('click', function(){ openFolder(c.path); });
      $crumbs.appendChild(el);
    });
  }

  // ── Folder view ────────────────────────────────────────────────────
  function openFolder(path){
    if (bridgeMissing()) { renderBridgeMissing(); return; }
    var data = callBridge('listFolder', [path || '']);
    if (data.error) {
      toast('Could not open folder: ' + data.error, true);
      return;
    }
    state.mode = 'folder';
    state.currentFolder = data.relativePath || '';
    state.folderEntries = data.entries || [];
    $subTitle.textContent = state.currentFolder ? state.currentFolder : 'On-Device';
    renderCrumbs(data.breadcrumbs || [{name:'Media',path:''}]);
    renderFolder();
  }

  function renderFolder(){
    $main.innerHTML = '';
    if (!state.folderEntries.length) {
      renderEmptyFolder();
      return;
    }
    // Folders first, then playlists, then audio, then video, then text.
    var order = {FOLDER:0,PLAYLIST:1,AUDIO:2,VIDEO:3,TEXT:4,OTHER:5};
    var sorted = state.folderEntries.slice().sort(function(a,b){
      var ka = order[a.kind] == null ? 6 : order[a.kind];
      var kb = order[b.kind] == null ? 6 : order[b.kind];
      if (ka !== kb) return ka - kb;
      return a.name.localeCompare(b.name);
    });
    sorted.forEach(function(e){
      var row = document.createElement('div');
      row.className = 'entry ' + e.kind.toLowerCase();
      row.tabIndex = 0;
      row.innerHTML =
        '<div class="ic">' + fileIcon(e.kind, e.name) + '</div>' +
        '<div class="txt">' +
          '<div class="name"></div>' +
          '<div class="meta"></div>' +
        '</div>' +
        '<button class="del" title="Delete">✕</button>' +
        '<div class="arrow">' + (e.kind === 'FOLDER' || e.kind === 'PLAYLIST' ? '›' : '') + '</div>';
      row.querySelector('.name').textContent = e.name;
      var meta = [];
      if (e.kind === 'FOLDER') meta.push('Folder');
      else if (e.kind === 'PLAYLIST') meta.push('Playlist');
      else meta.push(e.kind.charAt(0) + e.kind.slice(1).toLowerCase());
      if (e.sizeBytes > 0) meta.push(humanSize(e.sizeBytes));
      row.querySelector('.meta').textContent = meta.join(' · ');
      row.addEventListener('click', function(ev){
        if (ev.target.classList.contains('del')) return;
        handleEntryClick(e);
      });
      row.querySelector('.del').addEventListener('click', function(ev){
        ev.stopPropagation(); confirmDelete(e);
      });
      $main.appendChild(row);
    });
  }

  function renderEmptyFolder(){
    var info = callBridge('getRootInfo', []);
    var hint = info && info.rootShortHint ? info.rootShortHint : 'Android/data/<app>/files/Media';
    var el = document.createElement('div');
    el.className = 'empty';
    el.innerHTML =
      '<div class="big">♪</div>' +
      '<div>No media here yet.</div>' +
      '<div style="margin-top:12px;font-size:11.5px">' +
      'Upload from the TapInsight companion app (Library tab) ' +
      'or drop files into<br><code>' + hint + '</code>' +
      '</div>';
    $main.appendChild(el);
  }

  function renderBridgeMissing(){
    $main.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'empty';
    el.innerHTML =
      '<div class="big">!</div>' +
      '<div>Media bridge unavailable.</div>' +
      '<div style="margin-top:12px;font-size:11.5px">' +
      'Reopen from the dashboard — this page is only meant to run ' +
      'inside the TapInsight browser.' +
      '</div>';
    $main.appendChild(el);
  }

  function handleEntryClick(e){
    if (e.kind === 'FOLDER') {
      openFolder(e.relativePath);
    } else if (e.kind === 'PLAYLIST') {
      openPlaylist(e.relativePath, e.name);
    } else if (e.kind === 'AUDIO' || e.kind === 'VIDEO' || e.kind === 'TEXT') {
      // Hand off to the same media_player.html the browser uses for any
      // tapped audio/video URL — the WebView's shouldInterceptRequest wire
      // covers the /media/... stream with Range-aware partial content.
      // TEXT entries get the built-in reader (Gemini 3.1 TTS).
      openInPlayer({
        url:   TM.getMediaUrl(e.relativePath),
        title: e.name.replace(/\.[^.]+$/, ''),
        kind:  e.kind
      });
    }
  }

  // ── Playlist view ──────────────────────────────────────────────────
  function openPlaylist(path, name){
    if (bridgeMissing()) { renderBridgeMissing(); return; }
    var data = callBridge('parsePlaylist', [path]);
    if (data.error) {
      toast('Could not open playlist: ' + data.error, true);
      return;
    }
    state.mode = 'playlist';
    state.playlistPath = data.relativePath || path;
    state.playlistName = data.name || name || 'Playlist';
    state.playlistEntries = data.entries || [];
    $subTitle.textContent = 'Playlist · ' + state.playlistName;

    var folderPath = state.currentFolder;
    var crumbs = [{name:'Media',path:''}];
    if (folderPath) {
      var parts = folderPath.split('/').filter(Boolean);
      var acc = '';
      parts.forEach(function(p){ acc = acc ? acc + '/' + p : p; crumbs.push({name:p,path:acc}); });
    }
    crumbs.push({name:state.playlistName, path:state.playlistPath, playlist:true});
    renderCrumbs(crumbs);
    renderPlaylist(data.warnings || []);
  }

  function renderPlaylist(warnings){
    $main.innerHTML = '';
    if (warnings && warnings.length) {
      var w = document.createElement('div');
      w.className = 'empty';
      w.style.padding = '12px 14px';
      w.style.textAlign = 'left';
      w.innerHTML =
        '<div style="color:#ffb870;font-size:12px">' +
        warnings.map(function(m){ return '⚠ ' + m; }).join('<br>') + '</div>';
      $main.appendChild(w);
    }
    if (!state.playlistEntries.length) {
      var el = document.createElement('div');
      el.className = 'empty';
      el.innerHTML = '<div class="big">∅</div><div>Playlist is empty.</div>';
      $main.appendChild(el);
      return;
    }

    // Count playables so the header can tell us how many tracks Play All will
    // queue, and so we can disable the button when nothing is streamable.
    var playableCount = state.playlistEntries.filter(function(x){
      return !!x.playUrl;
    }).length;
    var playAllBar = document.createElement('div');
    playAllBar.className = 'playall-bar';
    playAllBar.innerHTML =
      '<button class="playall" id="btnPlayAll" ' +
        (playableCount ? '' : 'disabled') + '>' +
        '<span class="ico">▶</span>' +
        '<span class="lbl">Play All</span>' +
        '<span class="ct">' + playableCount + ' track' +
          (playableCount === 1 ? '' : 's') + '</span>' +
      '</button>';
    $main.appendChild(playAllBar);
    var btnPlayAll = playAllBar.querySelector('#btnPlayAll');
    if (playableCount) {
      btnPlayAll.addEventListener('click', function(){
        openPlaylistInPlayer(state.playlistPath, 0);
      });
    }

    state.playlistEntries.forEach(function(e, i){
      var row = document.createElement('div');
      var cls = e.kind === 'VIDEO' ? 'video' : 'audio';
      row.className = 'entry ' + cls;
      row.tabIndex = 0;
      row.innerHTML =
        '<div class="ic">' + (i + 1) + '</div>' +
        '<div class="txt">' +
          '<div class="name"></div>' +
          '<div class="meta"></div>' +
        '</div>' +
        '<div class="arrow">›</div>';
      row.querySelector('.name').textContent = e.title || e.rawPath;
      var metaBits = [];
      if (e.isAbsoluteUrl) metaBits.push('Remote');
      else if (e.resolvedRelativePath) metaBits.push(e.resolvedRelativePath);
      if (e.durationSeconds != null) metaBits.push(humanTime(e.durationSeconds));
      row.querySelector('.meta').textContent = metaBits.join(' · ');
      row.addEventListener('click', function(){
        if (!e.playUrl) {
          toast('This entry is not playable from here', true);
          return;
        }
        // Tap-to-start-here: open the same media_player.html playlist mode
        // the browser uses for TapClaw media, seeded at this track's index.
        openPlaylistInPlayer(state.playlistPath, i);
      });
      $main.appendChild(row);
    });
  }

  // ── Player hand-off ───────────────────────────────────────────────
  // Tapping audio/video anywhere in the library navigates to the same
  // media_player.html page the main browser uses for any tapped media URL
  // (see DualWebViewGroup.interceptMediaUrl). Keeps a single playback
  // surface with unified TTS, captions, visualizer, scrubber, etc.

  // Navigate to media_player.html on the SAME virtual origin that serves
  // our /media/ URLs — https://appassets.androidplatform.net/assets/... —
  // so the <audio>/<video> element's request for the interceptor-backed
  // media URL is same-origin and isn't dropped as a cross-origin sub-
  // resource from a file:// page.
  var PLAYER_URL = 'https://appassets.androidplatform.net/assets/media_player.html';

  function openInPlayer(item){
    if (!item || !item.url) { toast('Nothing to play', true); return; }
    var kind = (item.kind || 'AUDIO').toLowerCase();
    if (kind !== 'audio' && kind !== 'video' && kind !== 'text') kind = 'audio';
    var qp = '?type=' + kind +
             '&url=' + encodeURIComponent(item.url) +
             '&title=' + encodeURIComponent(item.title || '');
    window.location.href = PLAYER_URL + qp;
  }

  function openPlaylistInPlayer(path, startIdx){
    if (!path) { toast('No playlist to play', true); return; }
    var qp = '?type=playlist' +
             '&playlist=' + encodeURIComponent(path) +
             '&start=' + (startIdx | 0) +
             '&source=bridge';
    window.location.href = PLAYER_URL + qp;
  }

  // ── Toolbar actions ────────────────────────────────────────────────
  $btnGen.addEventListener('click', function(){
    if (bridgeMissing()) { renderBridgeMissing(); return; }
    if (state.mode !== 'folder') return;
    var data = callBridge('generatePlaylist', [state.currentFolder]);
    if (data.error) { toast(data.error, true); return; }
    toast('Playlist created: ' + (data.path || ''));
    openFolder(state.currentFolder);
  });
  $btnRefresh.addEventListener('click', function(){
    if (state.mode === 'folder') openFolder(state.currentFolder);
    else if (state.mode === 'playlist') openPlaylist(state.playlistPath, state.playlistName);
  });

  // Only offer "generate playlist" in folder mode.
  function syncToolbar(){
    $btnGen.disabled = state.mode !== 'folder';
  }

  // ── Delete confirmation ────────────────────────────────────────────
  function confirmDelete(entry){
    if (!confirm('Delete "' + entry.name + '"?\n\nThis cannot be undone.')) return;
    var data = callBridge('deleteEntry', [entry.relativePath]);
    if (data.status === 'deleted') {
      toast('Deleted: ' + entry.name);
      openFolder(state.currentFolder);
    } else {
      toast('Could not delete: ' + (data.error || 'unknown error'), true);
    }
  }

  // ── Hook mode changes to toolbar ───────────────────────────────────
  var originalOpenFolder   = openFolder;
  var originalOpenPlaylist = openPlaylist;
  openFolder   = function(p){ originalOpenFolder(p);   syncToolbar(); };
  openPlaylist = function(p,n){ originalOpenPlaylist(p,n); syncToolbar(); };

  // ── Init ───────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function(){
    if (bridgeMissing()) { renderBridgeMissing(); return; }
    openFolder('');
  });
})();
</script>
</body>
</html>
