<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TapInsight Media Player</title>
<style>
/* ── Reset & Base ── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#e8e8e8;
  font-family:'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none}

/* ── Text Reader Mode ── */
#textReader{display:none;position:absolute;inset:0;background:#0d0d0d;flex-direction:column}
#textReader.active{display:flex}

#textHeader{flex-shrink:0;padding:12px 16px 8px;background:linear-gradient(180deg,#111 0%,#0d0d0d 100%);
  border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:12px;z-index:10}
#textTitle{flex:1;font-size:15px;font-weight:600;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#textProgress{font-size:11px;color:#555;flex-shrink:0}

#textBody{flex:1;overflow-y:auto;padding:20px 18px 80px;line-height:1.85;font-size:17px;
  color:#d4d4d4;-webkit-overflow-scrolling:touch}
#textBody.large-font{font-size:22px;line-height:2}
#textBody .word{display:inline;cursor:default;border-radius:2px;transition:background .15s,color .15s}
#textBody .word.spoken{background:#00e5ff22;color:#00e5ff}
#textBody.underline-on .word.spoken{text-decoration:underline;
  text-decoration-color:#00e5ff80;text-underline-offset:3px}
#textBody .word.past{color:#888}
#textBody .paragraph{margin-bottom:1.2em;display:block}

/* Text Reader Controls */
#textControls{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,#111 0%,#11111100 100%);
  padding:14px 16px 16px;display:flex;align-items:flex-end;gap:10px;z-index:20}
/* Each button sits inside a labelled stack so users can read what it does
   instead of guessing from an emoji. */
.ctrl-stack{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.ctrl-stack .ctrl-lbl{font-size:10px;color:#888;letter-spacing:.02em;white-space:nowrap}
.ctrl-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:#1a1a1a;color:#e0e0e0;transition:background .2s,transform .1s}
.ctrl-btn:active{transform:scale(.9);background:#333}
.ctrl-btn.playing{background:#00e5ff;color:#000}
.ctrl-btn.on{background:#103a44;color:#00e5ff;box-shadow:inset 0 0 0 1px #00e5ff66}
#ttsSpeed{flex-shrink:0;font-size:11px;color:#888;min-width:36px;text-align:center}
#textSeekWrap{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:0 4px}
#textSeekWrap .ctrl-lbl{font-size:10px;color:#888;text-align:center}
#textSeekBar{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#333;
  border-radius:2px;outline:none;cursor:pointer}
#textSeekBar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#00e5ff;cursor:pointer}
/* TTS status banner — used to surface "API key missing", network errors,
   "preparing audio…" etc. so the reader isn't a silent black box. */
#ttsStatus{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  max-width:88%;padding:8px 14px;border-radius:18px;font-size:12px;z-index:25;
  background:rgba(20,20,20,.92);border:1px solid #333;color:#e0e0e0;
  display:none;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.4)}
#ttsStatus.show{display:block}
#ttsStatus.err{border-color:#ff7070;color:#ffb3b3}
#ttsStatus.info{border-color:#00e5ff55;color:#9ef3ff}

/* ── Audio Player Mode ── */
#audioPlayer{display:none;position:absolute;inset:0;background:radial-gradient(ellipse at center,#141420 0%,#0a0a0a 70%);
  flex-direction:column;align-items:center;justify-content:center;padding:24px}
#audioPlayer.active{display:flex}

#audioArt{width:200px;height:200px;border-radius:20px;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;
  box-shadow:0 8px 40px rgba(0,229,255,.12)}
#audioArt .icon{font-size:72px;opacity:.6}
#audioTitle{font-size:18px;font-weight:600;color:#e0e0e0;margin-bottom:6px;text-align:center;max-width:90%}
#audioArtist{font-size:13px;color:#888;margin-bottom:24px;text-align:center}
#audioSeekWrap{width:90%;max-width:400px;margin-bottom:8px}
#audioSeek{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:#222;
  border-radius:3px;outline:none;cursor:pointer}
#audioSeek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:#00e5ff;cursor:pointer;box-shadow:0 0 8px rgba(0,229,255,.4)}
#audioTimeRow{display:flex;justify-content:space-between;width:90%;max-width:400px;
  font-size:11px;color:#666;margin-bottom:20px}
#audioControls{display:flex;align-items:center;gap:20px}
.audio-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:#1a1a1a;color:#e0e0e0;font-size:22px;display:flex;align-items:center;
  justify-content:center;transition:background .2s,transform .15s}
.audio-btn:active{transform:scale(.9)}
.audio-btn.play{width:64px;height:64px;background:#00e5ff;color:#000;font-size:26px}
.audio-btn.play.playing{background:#ff5252}

/* ── Video Player Mode ── */
#videoPlayer{display:none;position:absolute;inset:0;background:#000;z-index:50}
#videoPlayer.active{display:block}
#videoEl{width:100%;height:100%;object-fit:contain;background:#000}

/* Video Overlay Controls */
#videoOverlay{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:flex-end;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
#videoOverlay.visible{opacity:1;pointer-events:auto}
#videoOverlay.always{opacity:1;pointer-events:auto}

#videoTopBar{position:absolute;top:0;left:0;right:0;padding:12px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%);
  display:flex;align-items:center;gap:12px}
#videoTitle{flex:1;font-size:14px;font-weight:600;color:#fff;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

#videoBottomBar{padding:10px 16px 18px;
  background:linear-gradient(0deg,rgba(0,0,0,.8) 0%,transparent 100%)}
#videoSeek{width:100%;height:8px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.15);border-radius:4px;outline:none;cursor:pointer;margin-bottom:8px}
#videoSeek::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:#00e5ff;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.5)}
#videoSeek::-webkit-slider-runnable-track{border-radius:4px}
#videoTimeRow{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:10px}
#videoControlRow{display:flex;align-items:center;justify-content:center;gap:24px}
.vid-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.1);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.vid-btn:active{background:rgba(255,255,255,.25)}
.vid-btn.play{width:56px;height:56px;background:#00e5ff;color:#000;font-size:24px}

/* Captions */
#captionOverlay{position:absolute;bottom:90px;left:5%;right:5%;text-align:center;
  z-index:65;pointer-events:none}
#captionText{display:inline-block;padding:6px 14px;border-radius:6px;
  background:rgba(0,0,0,.75);color:#fff;font-size:16px;line-height:1.5;
  max-width:90%;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ── Loading / Error ── */
#loadingOverlay{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;transition:opacity .4s}
#loadingOverlay.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#00e5ff;
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingText{margin-top:14px;font-size:13px;color:#888}
#errorMsg{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#1a0000;border:1px solid #f44336;border-radius:10px;padding:20px;
  text-align:center;color:#ef9a9a;font-size:14px;z-index:200;max-width:80%}

/* ── Gesture Hint ── */
#gestureHint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#aaa;padding:8px 16px;border-radius:20px;
  font-size:11px;white-space:nowrap;z-index:80;opacity:0;transition:opacity .5s;pointer-events:none}
#gestureHint.show{opacity:1}

/* ── Playlist Mode ── */
#plBar{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:rgba(0,0,0,.7);
  border-bottom:1px solid #1a1a1a;display:none;align-items:center;gap:8px;z-index:70}
#plBar.active{display:flex}
#plBar .track-info{flex:1;min-width:0;font-size:12px;color:#ccc;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#plBar .track-info .idx{color:#00e5ff;font-weight:600;margin-right:6px}
#plBar button{background:rgba(255,255,255,.08);color:#eee;border:none;border-radius:4px;
  padding:4px 8px;font-size:12px;cursor:pointer;flex-shrink:0}
/* :hover declared before .active so the toggled (active) state visually wins
   even after tap — otherwise hover's lighter background lingers on touch
   devices and makes shuffle/repeat look like they didn't toggle. */
#plBar button:hover{background:rgba(255,255,255,.18)}
#plBar button.active,
#plBar button.active:hover{background:#00e5ff;color:#000;box-shadow:0 0 0 1px #00e5ff}

#plDrawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);background:#0d0d0d;
  border-left:1px solid #222;transform:translateX(100%);transition:transform .25s;
  z-index:75;display:flex;flex-direction:column;padding:14px}
#plDrawer.open{transform:translateX(0)}
#plDrawer h3{color:#00e5ff;font-size:14px;margin-bottom:10px;display:flex;
  justify-content:space-between;align-items:center}
#plDrawer h3 .close{background:none;border:none;color:#888;font-size:20px;cursor:pointer}
#plQueueList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.q-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#111;
  border:1px solid #1a1a1a;border-radius:6px;cursor:pointer;font-size:12px;color:#bbb;
  transition:background .15s,border-color .15s}
.q-item:hover{background:#1a1a1a;border-color:#2a2a2a}
.q-item.current{background:#002a33;border-color:#00e5ff;color:#00e5ff}
.q-item .q-num{color:#555;width:22px;text-align:right;font-size:10px;flex-shrink:0}
.q-item .q-icon{font-size:13px;flex-shrink:0}
.q-item .q-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pl-nav-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:#1a1a1a;color:#e0e0e0;font-size:18px;display:flex;align-items:center;
  justify-content:center;transition:background .2s,transform .15s}
.pl-nav-btn:active{transform:scale(.9)}
.pl-nav-btn:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">Loading media...</div>
  <div id="loadingDiag" style="margin-top:8px;font-size:10px;color:#555;max-width:80vw;text-align:center;word-break:break-all"></div>
</div>

<!-- Error Display -->
<div id="errorMsg"></div>

<!-- ═══ TEXT READER ═══ -->
<div id="textReader">
  <div id="textHeader">
    <div id="textTitle">Document</div>
    <div id="textProgress"></div>
  </div>
  <div id="textBody"></div>
  <!-- Status banner (errors, "preparing audio", etc.) — hidden until set -->
  <div id="ttsStatus"></div>
  <div id="textControls">
    <div class="ctrl-stack">
      <button class="ctrl-btn" id="ttsPlayBtn" title="Read aloud">🔊</button>
      <span class="ctrl-lbl" id="ttsPlayLbl">Read</span>
    </div>
    <div id="textSeekWrap">
      <input type="range" id="textSeekBar" min="0" max="100" value="0">
      <span class="ctrl-lbl">Scrub</span>
    </div>
    <div class="ctrl-stack">
      <button class="ctrl-btn" id="ttsFasterBtn" title="Cycle speed">⏩</button>
      <span class="ctrl-lbl" id="ttsSpeed">1.0×</span>
    </div>
    <div class="ctrl-stack">
      <button class="ctrl-btn" id="ttsUnderlineBtn" title="Toggle word underline"><span style="text-decoration:underline;text-underline-offset:2px">U</span></button>
      <span class="ctrl-lbl">Underline</span>
    </div>
    <div class="ctrl-stack">
      <button class="ctrl-btn" id="ttsFontBtn" title="Toggle large font">Aa</button>
      <span class="ctrl-lbl">Size</span>
    </div>
  </div>
</div>

<!-- ═══ AUDIO PLAYER ═══ -->
<div id="audioPlayer">
  <div id="audioArt"><div class="icon">🎵</div></div>
  <div id="audioTitle">Audio</div>
  <div id="audioArtist">Unknown</div>
  <div id="audioSeekWrap"><input type="range" id="audioSeek" min="0" max="100" value="0" step="0.1"></div>
  <div id="audioTimeRow"><span id="audioTimeCur">0:00</span><span id="audioTimeDur">0:00</span></div>
  <div id="audioControls">
    <button class="audio-btn" id="audioRew" title="Rewind 15s">⏪</button>
    <button class="audio-btn play" id="audioPlayBtn">▶</button>
    <button class="audio-btn" id="audioFwd" title="Forward 15s">⏩</button>
  </div>
</div>

<!-- ═══ VIDEO PLAYER ═══ -->
<div id="videoPlayer">
  <video id="videoEl" playsinline></video>
  <div id="captionOverlay"><span id="captionText"></span></div>
  <div id="videoOverlay" class="always">
    <div id="videoTopBar">
      <div id="videoTitle">Video</div>
    </div>
    <div id="videoBottomBar">
      <input type="range" id="videoSeek" min="0" max="100" value="0" step="0.01">
      <div id="videoTimeRow"><span id="videoTimeCur">0:00</span><span id="videoTimeDur">0:00</span></div>
      <div id="videoControlRow">
        <button class="vid-btn" id="videoRew">⏪</button>
        <button class="vid-btn play" id="videoPlayBtn">▶</button>
        <button class="vid-btn" id="videoFwd">⏩</button>
        <button class="vid-btn" id="videoCCBtn" title="Captions">CC</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ PLAYLIST MODE OVERLAYS ═══ -->
<div id="plBar">
  <button id="plPrevBtn" class="pl-nav-btn" title="Previous" style="width:32px;height:32px;font-size:14px">⏮</button>
  <button id="plNextBtn" class="pl-nav-btn" title="Next" style="width:32px;height:32px;font-size:14px">⏭</button>
  <div class="track-info">
    <span class="idx" id="plIdxLabel">1/1</span>
    <span id="plTrackTitle">—</span>
  </div>
  <button id="plShuffleBtn" title="Shuffle">🔀</button>
  <button id="plRepeatBtn" title="Repeat off">🔁</button>
  <button id="plQueueBtn" title="Queue">☰</button>
</div>

<div id="plDrawer">
  <h3>
    <span id="plName">Playlist</span>
    <button class="close" id="plDrawerClose">×</button>
  </h3>
  <div id="plQueueList"></div>
</div>

<!-- Gesture Hint -->
<div id="gestureHint">Tap to pause · Double-tap to exit</div>

<audio id="audioEl" preload="auto"></audio>

<script>
// ── URL Params ──
var params = new URLSearchParams(window.location.search);
var mediaUrl = params.get('url') || '';
var mediaType = (params.get('type') || '').toLowerCase();  // text, audio, video
var mediaTitle = params.get('title') || '';
var captionUrl = params.get('srt') || params.get('captions') || '';

// Stamp a tiny diagnostic trail onto the spinner so a blank hang is
// actually debuggable from the glasses — we don't have console access
// in production, so the only failure signal we've got is the overlay.
function diag(msg) {
  try {
    var d = document.getElementById('loadingDiag');
    if (!d) return;
    var now = new Date();
    var ts  = now.getMinutes() + ':' + String(now.getSeconds()).padStart(2,'0');
    var line = '[' + ts + '] ' + msg;
    d.textContent = d.textContent ? (d.textContent + '\n' + line) : line;
  } catch(_){}
}
window.addEventListener('error', function(ev){
  diag('JS error: ' + (ev.message || ev.error || 'unknown'));
});
diag('params: type=' + mediaType + ' urlLen=' + mediaUrl.length +
     ' pl=' + (params.get('playlist') || '') +
     ' src=' + (params.get('source') || ''));

// ── Detect media type from URL if not explicit ──
if (!mediaType && mediaUrl) {
  var ext = mediaUrl.split('?')[0].split('#')[0].split('.').pop().toLowerCase();
  var textExts = ['txt','md','log','csv','json','xml','html','htm','rtf','ini','cfg','conf','yaml','yml','toml'];
  var audioExts = ['mp3','wav','ogg','m4a','aac','flac','wma','opus','webm'];
  var videoExts = ['mp4','webm','mkv','avi','mov','m4v','ogv','3gp'];
  if (textExts.indexOf(ext) !== -1) mediaType = 'text';
  else if (audioExts.indexOf(ext) !== -1) mediaType = 'audio';
  else if (videoExts.indexOf(ext) !== -1) mediaType = 'video';
  else mediaType = 'text'; // Default fallback
}

if (!mediaTitle) {
  try { mediaTitle = decodeURIComponent(mediaUrl.split('/').pop().split('?')[0]); } catch(e) { mediaTitle = 'Media'; }
}

// ── Utility ──
function fmt(s) {
  if (!s || !isFinite(s)) return '0:00';
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return h > 0 ? h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')
               : m+':'+String(sec).padStart(2,'0');
}
function showError(msg) {
  document.getElementById('loadingOverlay').classList.add('hidden');
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}
function showGestureHint() {
  var h = document.getElementById('gestureHint');
  h.classList.add('show');
  setTimeout(function(){ h.classList.remove('show'); }, 3000);
}

// ══════════════════════════════════════════════
// ══════ TEXT READER ══════════════════════════
// ══════════════════════════════════════════════
var ttsWords = [];
var ttsIndex = 0;
var ttsPlaying = false;
var ttsRate = 1.0;
var ttsUtterance = null;
var ttsPaused = false;
// Counts how many chunks have been synthesized in the current play
// session. Used by speakNextChunk to ramp up chunk sizes — the first few
// are deliberately small so the pipeline has time to warm up without any
// visible stall between chunks. See TTS_CHUNK_RAMP below.
var ttsChunkCount = 0;
// Chunk-size ramp, in words. Index = nth chunk in session (0-based).
// The last entry is the steady-state size used for every chunk after it.
//
// Why ramp at all?
//   * Chunk 1's synth blocks playback start — small (12 words) keeps the
//     "Preparing audio…" wait to ~1.5-2s.
//   * Chunk N's synth must finish within chunk N-1's *playback* duration
//     for gap-free handoff. A 12-word chunk only buys ~5s of playback,
//     but a 30-word chunk's synth takes ~4-5s — the margin is too tight
//     and users see a stall at the chunk-1 → chunk-2 boundary. Ramping
//     up gradually (12, 18, 24, 30) keeps each chunk's synth safely
//     shorter than the one playing while it's being built.
//   * Steady-state 30 words is best: fewer round-trips overall, and by
//     then each chunk's ~12s of playback easily covers the next synth.
var TTS_CHUNK_RAMP = [12, 18, 24, 30];
var largeFontOn = false;
// Configurable via URL params from companion app preferences
var preferredVoiceName = params.get('voice') || '';
var underlineOn = params.get('underline') !== 'false'; // default on

function initTextReader(text) {
  document.getElementById('textReader').classList.add('active');
  document.getElementById('textTitle').textContent = mediaTitle;
  var body = document.getElementById('textBody');
  body.innerHTML = '';
  ttsWords = [];
  // Split into paragraphs, then words
  var paragraphs = text.split(/\n\s*\n|\r\n\s*\r\n/);
  if (paragraphs.length <= 1) paragraphs = text.split(/\n|\r\n/);
  var globalIdx = 0;
  paragraphs.forEach(function(para) {
    if (!para.trim()) return;
    var pEl = document.createElement('span');
    pEl.className = 'paragraph';
    var words = para.trim().split(/(\s+)/);
    words.forEach(function(w) {
      if (!w.trim()) {
        pEl.appendChild(document.createTextNode(w));
        return;
      }
      var span = document.createElement('span');
      span.className = 'word';
      span.dataset.idx = globalIdx;
      span.textContent = w;
      pEl.appendChild(span);
      ttsWords.push({ el: span, text: w, idx: globalIdx });
      globalIdx++;
      pEl.appendChild(document.createTextNode(' '));
    });
    body.appendChild(pEl);
  });
  updateTextProgress();
  var seekBar = document.getElementById('textSeekBar');
  seekBar.max = Math.max(ttsWords.length - 1, 1);
  seekBar.value = 0;
  seekBar.addEventListener('input', function() {
    ttsIndex = parseInt(this.value);
    highlightWord(ttsIndex);
    if (ttsPlaying) { stopTts(); startTtsFrom(ttsIndex); }
  });
  // Apply underline preference (default on) — reflected in button .on state
  body.classList.toggle('underline-on', underlineOn);
  var ulBtn = document.getElementById('ttsUnderlineBtn');
  ulBtn.classList.toggle('on', underlineOn);
  ulBtn.addEventListener('click', toggleUnderline);
  document.getElementById('ttsPlayBtn').addEventListener('click', toggleTts);
  document.getElementById('ttsFasterBtn').addEventListener('click', cycleTtsSpeed);
  document.getElementById('ttsFontBtn').addEventListener('click', toggleFontSize);
  // Reflect current speed in the label
  document.getElementById('ttsSpeed').textContent = ttsRate + '×';
  hideLoading();
  showGestureHint();
}

function updateTextProgress() {
  var pct = ttsWords.length > 0 ? Math.round((ttsIndex / ttsWords.length) * 100) : 0;
  document.getElementById('textProgress').textContent = pct + '% · ' + ttsWords.length + ' words';
}

function highlightWord(idx) {
  ttsWords.forEach(function(w, i) {
    w.el.classList.remove('spoken');
    if (i < idx) w.el.classList.add('past');
    else w.el.classList.remove('past');
  });
  if (idx < ttsWords.length) {
    ttsWords[idx].el.classList.add('spoken');
    // Auto-scroll: only scroll when the spoken word nears the bottom of the
    // visible viewport.  This avoids constant jittery scrolling on every word
    // and instead pages smoothly when the reader moves past the visible area.
    autoScrollToWord(ttsWords[idx].el);
  }
  document.getElementById('textSeekBar').value = idx;
  updateTextProgress();
}

// Efficient page-style auto-scroll: scroll only when the current word is in the
// bottom 20% of the container (or above the top, e.g. after a seek).  When
// triggered, positions the word at ~25% from the top so the reader has context
// of what was just read while seeing plenty of upcoming text.
function autoScrollToWord(el) {
  var container = document.getElementById('textBody');
  if (!container) return;
  var cRect = container.getBoundingClientRect();
  var wRect = el.getBoundingClientRect();
  // Position of word relative to the container viewport
  var relTop = wRect.top - cRect.top;
  var relBot = wRect.bottom - cRect.top;
  var threshold = cRect.height * 0.80; // bottom 20% triggers scroll
  var aboveView = relBot < 0;          // word scrolled above viewport (seek)
  if (relTop > threshold || aboveView) {
    // Target: place word at 25% from the top of the container
    var targetOffset = cRect.height * 0.25;
    var scrollTo = container.scrollTop + (relTop - targetOffset);
    container.scrollTo({ top: scrollTo, behavior: 'smooth' });
  }
}

function toggleTts() {
  if (ttsPlaying) { stopTts(); }
  else { startTtsFrom(ttsIndex); }
}

// ── TTS status banner ──
// Shows a message below the text body to tell the user what TTS is doing
// (preparing, idle) or why it failed (API key missing, network error).
// Auto-fades info messages; error messages stick until cleared.
var _ttsStatusTimer = null;
function setTtsStatus(msg, variant) {
  var el = document.getElementById('ttsStatus');
  if (!el) return;
  if (_ttsStatusTimer) { clearTimeout(_ttsStatusTimer); _ttsStatusTimer = null; }
  if (!msg) { el.classList.remove('show','err','info'); el.textContent=''; return; }
  el.textContent = msg;
  el.classList.remove('err','info');
  el.classList.add(variant === 'err' ? 'err' : 'info');
  el.classList.add('show');
  if (variant !== 'err') {
    _ttsStatusTimer = setTimeout(function(){ setTtsStatus(''); }, 2200);
  }
}

function startTtsFrom(startIdx) {
  if (startIdx >= ttsWords.length) { startIdx = 0; ttsIndex = 0; }
  ttsPlaying = true;
  // Reset the chunk counter so the ramp (12 → 18 → 24 → 30 words)
  // restarts. This is what makes "Preparing audio…" clear quickly on
  // each tap of Read, including after a Stop+Read cycle.
  ttsChunkCount = 0;
  document.getElementById('ttsPlayBtn').textContent = '⏸';
  document.getElementById('ttsPlayBtn').classList.add('playing');
  document.getElementById('ttsPlayLbl').textContent = 'Pause';
  setTtsStatus('Preparing audio…', 'info');
  // Defer the synchronous bridge call by one animation frame so the status
  // banner actually paints before `@JavascriptInterface speakText` blocks the
  // JS thread on the HTTP round-trip.
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      if (ttsPlaying) speakNextChunk(startIdx);
    });
  });
}

// Hidden <audio> used for Gemini TTS playback. Lazily inserted so we don't
// disturb the existing audio/video players if the user never triggers TTS.
var ttsBridgeAudio = null;
function getTtsBridgeAudio() {
  if (ttsBridgeAudio) return ttsBridgeAudio;
  ttsBridgeAudio = document.createElement('audio');
  ttsBridgeAudio.id = 'ttsBridgeAudio';
  ttsBridgeAudio.preload = 'auto';
  ttsBridgeAudio.style.display = 'none';
  document.body.appendChild(ttsBridgeAudio);
  return ttsBridgeAudio;
}

// ─── Async TTS pipeline ────────────────────────────────────────────────
//
// The bridge has two entry points:
//   * TM.speakText(...)         — synchronous; blocks the JS thread for the
//                                 whole HTTP round-trip. Kept as a fallback
//                                 for older bridge builds.
//   * TM.startSpeakText(...)    — fire-and-forget; returns immediately with
//                                 a requestId. When synth finishes, native
//                                 posts `window.__ttsComplete(id, json)`.
//
// Using the async path lets us prefetch chunk N+1 while chunk N is still
// playing, so the audio gap between chunks shrinks from "a full HTTP round
// trip" to "whatever's left of N+1's synth after N finishes draining".
//
// The tail of `speakCurrentAndPrefetchNext` kicks off the prefetch for
// chunk N+1 BEFORE awaiting the audio for chunk N, which is what actually
// closes the gap.

var ttsPending = Object.create(null); // requestId → { resolve, reject }
var ttsReqCounter = 0;
var nextChunkPrefetch = null;          // Promise<synthResult> | null

window.__ttsComplete = function(requestId, jsonPayload) {
  var entry = ttsPending[requestId];
  if (!entry) return;
  delete ttsPending[requestId];
  var data;
  try { data = JSON.parse(jsonPayload); }
  catch (e) { entry.reject(new Error('bad-json')); return; }
  if (!data || data.error || !data.audioUrl) {
    entry.reject(new Error(data && data.error || 'no-audio'));
    return;
  }
  entry.resolve(data);
};

/**
 * Fire-and-forget synth. Resolves with `{audioUrl, model, sampleRate}` when
 * the native bridge posts back `__ttsComplete`. Rejects if the bridge is
 * absent, refuses the call, or the synth errored out.
 */
function synthChunkAsync(chunkText) {
  return new Promise(function(resolve, reject) {
    var TM = window.TapMedia;
    if (!TM) { reject(new Error('no-bridge')); return; }
    var hasAsync = typeof TM.startSpeakText === 'function';
    var hasSync = typeof TM.speakText === 'function';
    if (!hasAsync && !hasSync) { reject(new Error('no-bridge')); return; }
    if (hasAsync) {
      var id = 'tts_' + (++ttsReqCounter) + '_' + Date.now();
      ttsPending[id] = { resolve: resolve, reject: reject };
      var raw;
      try { raw = TM.startSpeakText(chunkText, preferredVoiceName || '', ttsRate || 1.0, id); }
      catch (e) { delete ttsPending[id]; reject(e); return; }
      var data;
      try { data = JSON.parse(raw); } catch (e) { delete ttsPending[id]; reject(new Error('bad-json')); return; }
      if (!data || data.error || data.status !== 'pending') {
        delete ttsPending[id];
        reject(new Error(data && data.error || 'start-failed'));
      }
      // else: resolution happens via __ttsComplete
      return;
    }
    // Fall back to synchronous bridge (older builds). Runs inline on the JS
    // thread; we wrap in a microtask so at least the caller's .then() chain
    // keeps its Promise semantics.
    Promise.resolve().then(function() {
      var raw;
      try { raw = TM.speakText(chunkText, preferredVoiceName || '', ttsRate || 1.0); }
      catch (e) { reject(e); return; }
      var data;
      try { data = JSON.parse(raw); } catch (e) { reject(new Error('bad-json')); return; }
      if (!data || data.error || !data.audioUrl) {
        reject(new Error(data && data.error || 'no-audio'));
        return;
      }
      resolve(data);
    });
  });
}

/**
 * Load + play one pre-synthesized audio URL and resolve when playback ends.
 * Word highlighting is driven by requestAnimationFrame reading
 * `audio.currentTime`, so timing self-corrects instead of drifting off a
 * free-running interval. Pacing is weighted by character count so short
 * words ("a", "to") pass faster than long ones ("transformation") —
 * closer to how humans actually read.
 */
function playChunkAudio(audioUrl, fromIdx, endIdx) {
  return new Promise(function(resolve, reject) {
    var a = getTtsBridgeAudio();
    a.src = audioUrl;

    // Build cumulative-character-weight bins for each word in the chunk so
    // highlight advances in proportion to speaking time rather than word
    // count. `+1` per word avoids division-by-zero on punctuation-only tokens.
    var wordCount = endIdx - fromIdx;
    var weights = new Array(wordCount);
    var totalWeight = 0;
    for (var i = 0; i < wordCount; i++) {
      var txt = (ttsWords[fromIdx + i] && ttsWords[fromIdx + i].text) || '';
      var w = Math.max(1, txt.length);
      weights[i] = w;
      totalWeight += w;
    }
    var cumFraction = new Array(wordCount + 1);
    cumFraction[0] = 0;
    var acc = 0;
    for (var j = 0; j < wordCount; j++) {
      acc += weights[j];
      cumFraction[j + 1] = acc / totalWeight;
    }

    var rafId = 0;
    var finished = false;
    function tick() {
      if (finished) return;
      if (!ttsPlaying) { cancelAnimationFrame(rafId); return; }
      var dur = a.duration && isFinite(a.duration) && a.duration > 0 ? a.duration : 0;
      var cur = a.currentTime || 0;
      var progress = dur > 0 ? Math.min(cur / dur, 1) : 0;
      // Binary search the word whose window contains `progress`.
      var lo = 0, hi = wordCount - 1, idx = 0;
      while (lo <= hi) {
        var mid = (lo + hi) >> 1;
        if (cumFraction[mid + 1] < progress) { idx = mid + 1; lo = mid + 1; }
        else if (cumFraction[mid] > progress) { hi = mid - 1; }
        else { idx = mid; break; }
      }
      if (idx >= wordCount) idx = wordCount - 1;
      var globalIdx = fromIdx + idx;
      if (globalIdx !== ttsIndex && globalIdx < ttsWords.length) {
        ttsIndex = globalIdx;
        highlightWord(globalIdx);
      }
      rafId = requestAnimationFrame(tick);
    }

    a.onloadedmetadata = function() { rafId = requestAnimationFrame(tick); };
    a.onended = function() {
      finished = true;
      if (rafId) cancelAnimationFrame(rafId);
      resolve();
    };
    a.onerror = function() {
      finished = true;
      if (rafId) cancelAnimationFrame(rafId);
      reject(new Error('audio-load-failed'));
    };
    a.play().catch(function(err) {
      finished = true;
      if (rafId) cancelAnimationFrame(rafId);
      reject(err);
    });
  });
}

/** Compose: synth (or reuse prefetch) → play → resolve on ended. */
function speakChunkViaGemini(chunkText, fromIdx, endIdx, prefetched) {
  var synthPromise = prefetched || synthChunkAsync(chunkText);
  return synthPromise.then(function(data) {
    return playChunkAudio(data.audioUrl, fromIdx, endIdx);
  });
}

function speakNextChunk(fromIdx) {
  if (!ttsPlaying || fromIdx >= ttsWords.length) {
    if (fromIdx >= ttsWords.length) stopTts();
    return;
  }
  // Chunk sizing strategy: ramp from small (fast first-byte) to steady
  // state (fewer round-trips) so no chunk's synth outruns the previous
  // chunk's playback. See TTS_CHUNK_RAMP comment for reasoning.
  function sizeForChunk(n) {
    var i = Math.min(n, TTS_CHUNK_RAMP.length - 1);
    return TTS_CHUNK_RAMP[i];
  }
  var chunkSize = sizeForChunk(ttsChunkCount);
  var endIdx = Math.min(fromIdx + chunkSize, ttsWords.length);
  var chunkText = ttsWords.slice(fromIdx, endIdx).map(function(w){ return w.text; }).join(' ');
  ttsChunkCount++;

  // Pick up the prefetch from the previous iteration if present; otherwise
  // kick off a fresh synth for the current chunk.
  var currentPrefetch = nextChunkPrefetch;
  nextChunkPrefetch = null;

  // Start the NEXT chunk's synth now, BEFORE we await the current one —
  // this is what makes playback feel continuous. By the time the current
  // chunk's audio finishes draining, the next chunk's audio URL is usually
  // already in memory. The next chunk uses its own step along the ramp:
  // ramp[1] right after chunk 1, ramp[2] after chunk 2, etc.
  var nextFromIdx = endIdx;
  if (ttsPlaying && nextFromIdx < ttsWords.length) {
    var nextChunkSize = sizeForChunk(ttsChunkCount);
    var nextEndIdx = Math.min(nextFromIdx + nextChunkSize, ttsWords.length);
    var nextChunkText = ttsWords.slice(nextFromIdx, nextEndIdx).map(function(w){ return w.text; }).join(' ');
    nextChunkPrefetch = synthChunkAsync(nextChunkText).catch(function(e) {
      // Swallow errors here — the next iteration will retry inline and
      // surface the failure through the regular .catch path.
      return Promise.reject(e);
    });
  }

  // Primary: Gemini 3.1 via Android bridge (works on glasses WebView, which
  // has no browser speechSynthesis). Fallback: browser SpeechSynthesis when
  // available (companion-app browser viewer).
  speakChunkViaGemini(chunkText, fromIdx, endIdx, currentPrefetch).then(function() {
    setTtsStatus('');
    ttsIndex = endIdx;
    highlightWord(endIdx);
    if (ttsPlaying) speakNextChunk(endIdx);
  }).catch(function(err) {
    // Prefetch we already kicked off is now orphaned — if it resolves later
    // the audio URL just sits unused in the cache. Nothing to clean up on
    // the JS side; TtsCacheStore's LRU will evict it.
    nextChunkPrefetch = null;
    var reason = (err && err.message) ? err.message : String(err || 'unknown');
    var hasBrowserTts = (typeof window.speechSynthesis !== 'undefined' &&
                        window.speechSynthesis &&
                        typeof window.SpeechSynthesisUtterance !== 'undefined');
    if (!hasBrowserTts) {
      // On the glasses there is no fallback — surface the reason so the user
      // knows to set the API key or check network. Most common: "no-bridge"
      // (text mode loaded outside the trusted bridge) or "Gemini API key not
      // configured…" from MediaLibraryBridge.
      console.warn('TTS unavailable:', reason);
      var shown = reason;
      if (reason === 'no-bridge') shown = 'TTS bridge unavailable on this page.';
      else if (reason === 'bad-json') shown = 'TTS returned invalid data.';
      else if (reason === 'no-audio') shown = 'TTS produced no audio.';
      else if (reason === 'audio-load-failed') shown = 'Could not play generated audio.';
      setTtsStatus('Read aloud failed: ' + shown, 'err');
      ttsPlaying = false;
      var btn = document.getElementById('ttsPlayBtn');
      if (btn) { btn.textContent = '🔊'; btn.classList.remove('playing'); }
      var lbl = document.getElementById('ttsPlayLbl');
      if (lbl) lbl.textContent = 'Read';
      return;
    }
    // Browser Web Speech fallback (companion-app viewer)
    setTtsStatus('');
    speakChunkViaBrowser(chunkText, fromIdx, endIdx);
  });
}

function speakChunkViaBrowser(chunkText, fromIdx, endIdx) {
  var utter = new SpeechSynthesisUtterance(chunkText);
  utter.rate = ttsRate;
  utter.pitch = 1.0;
  // Pick voice: user preference from companion app, or soothing fallback
  var voices = window.speechSynthesis.getVoices();
  var preferred = null;
  if (preferredVoiceName) {
    var pref = preferredVoiceName.toLowerCase();
    preferred = voices.find(function(v){ return v.name.toLowerCase() === pref; })
      || voices.find(function(v){ return v.name.toLowerCase().indexOf(pref) !== -1; });
  }
  if (!preferred) {
    preferred = voices.find(function(v){
      return v.name.indexOf('Samantha') !== -1 || v.name.indexOf('Google UK English Female') !== -1
        || v.name.indexOf('Karen') !== -1 || v.name.indexOf('Moira') !== -1;
    }) || voices.find(function(v){ return v.lang.startsWith('en') && v.name.indexOf('Female') !== -1; })
       || voices.find(function(v){ return v.lang.startsWith('en'); });
  }
  if (preferred) utter.voice = preferred;

  // Word boundary events for highlighting
  var wordOffset = fromIdx;
  utter.addEventListener('boundary', function(e) {
    if (e.name === 'word') {
      // Map character offset to word index within chunk
      var spoken = chunkText.substring(0, e.charIndex);
      var wordsSpoken = spoken.split(/\s+/).filter(function(w){ return w.length > 0; }).length;
      var currentIdx = fromIdx + wordsSpoken;
      if (currentIdx < ttsWords.length) {
        ttsIndex = currentIdx;
        highlightWord(currentIdx);
      }
    }
  });

  utter.addEventListener('end', function() {
    ttsIndex = endIdx;
    highlightWord(endIdx);
    if (ttsPlaying) speakNextChunk(endIdx);
  });

  utter.addEventListener('error', function(e) {
    if (e.error !== 'canceled') console.error('TTS error:', e.error);
  });

  ttsUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function stopTts() {
  ttsPlaying = false;
  // Drop any in-flight prefetch so its audio URL doesn't get picked up by
  // the next startTtsFrom() call. Pending promises left in ttsPending will
  // resolve into the void harmlessly (resolve/reject are no-ops once the
  // entry is removed from the map — see __ttsComplete).
  nextChunkPrefetch = null;
  for (var k in ttsPending) { if (ttsPending.hasOwnProperty(k)) delete ttsPending[k]; }
  // Gemini bridge path: stop the hidden <audio> element + tell Android to abort
  try {
    if (ttsBridgeAudio) {
      ttsBridgeAudio.pause();
      ttsBridgeAudio.removeAttribute('src');
      ttsBridgeAudio.load();
    }
  } catch (_) {}
  try {
    var TM = window.TapMedia;
    if (TM && typeof TM.stopSpeaking === 'function') TM.stopSpeaking();
  } catch (_) {}
  // Browser speechSynthesis fallback path
  try {
    if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
  } catch (_) {}
  var btn = document.getElementById('ttsPlayBtn');
  if (btn) {
    btn.textContent = '🔊';
    btn.classList.remove('playing');
  }
  var lbl = document.getElementById('ttsPlayLbl');
  if (lbl) lbl.textContent = 'Read';
  // Clear any "preparing…" spinner banner — but leave error banners alone so
  // the user can still see why TTS failed after they tap stop.
  var st = document.getElementById('ttsStatus');
  if (st && !st.classList.contains('err')) setTtsStatus('');
}

function toggleUnderline() {
  underlineOn = !underlineOn;
  document.getElementById('textBody').classList.toggle('underline-on', underlineOn);
  document.getElementById('ttsUnderlineBtn').classList.toggle('on', underlineOn);
}

function cycleTtsSpeed() {
  var speeds = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
  var cur = speeds.indexOf(ttsRate);
  ttsRate = speeds[(cur + 1) % speeds.length];
  document.getElementById('ttsSpeed').textContent = ttsRate + '×';
  if (ttsPlaying) { stopTts(); startTtsFrom(ttsIndex); }
}

}

// ══════ AUDIO PLAYER ════════════════════════
// ══════════════════════════════════════════════
var audioEl = document.getElementById('audioEl');

function initAudioPlayer(url) {
  diag('initAudioPlayer  url=' + (url || '').slice(0, 120));
  document.getElementById('audioPlayer').classList.add('active');
  document.getElementById('audioTitle').textContent = mediaTitle;
  audioEl.src = url;
  audioEl.load();

  var seek = document.getElementById('audioSeek');
  var playBtn = document.getElementById('audioPlayBtn');

  // Spinner-clear fallbacks: `loadedmetadata` is the ideal trigger, but some
  // codec/header combinations never fire it on this WebView build — add
  // `loadeddata` and `canplay` as secondary triggers so we don't sit on the
  // spinner forever. Anything that dispatches one of these means audio is
  // actually working.
  function armedHide() {
    if (!isFinite(audioEl.duration) || audioEl.duration <= 0) {
      document.getElementById('audioTimeDur').textContent = '';
      seek.max = 100;
    } else {
      document.getElementById('audioTimeDur').textContent = fmt(audioEl.duration);
      seek.max = audioEl.duration;
    }
    hideLoading();
    showGestureHint();
  }
  audioEl.addEventListener('loadedmetadata', armedHide);
  audioEl.addEventListener('loadeddata',     armedHide);
  audioEl.addEventListener('canplay',        armedHide);
  audioEl.addEventListener('playing',        armedHide);
  audioEl.addEventListener('timeupdate', function() {
    if (!seek._dragging) {
      seek.value = audioEl.currentTime;
      document.getElementById('audioTimeCur').textContent = fmt(audioEl.currentTime);
    }
  });
  audioEl.addEventListener('ended', function() {
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
  });
  audioEl.addEventListener('error', function(e) {
    var code = audioEl.error ? audioEl.error.code : '?';
    var msg  = audioEl.error ? audioEl.error.message || '' : '';
    showError('Could not load audio (code ' + code + (msg ? ': ' + msg : '') + ').');
  });
  // Belt-and-suspenders: if nothing fires in 15s, surface the failure
  // visibly instead of leaving the user staring at a silent spinner.
  setTimeout(function(){
    if (!document.getElementById('loadingOverlay').classList.contains('hidden')) {
      showError('Audio load timed out. URL: ' + url);
    }
  }, 15000);

  seek.addEventListener('mousedown', function(){ seek._dragging = true; });
  seek.addEventListener('touchstart', function(){ seek._dragging = true; });
  seek.addEventListener('input', function() {
    document.getElementById('audioTimeCur').textContent = fmt(parseFloat(this.value));
  });
  seek.addEventListener('change', function() {
    audioEl.currentTime = parseFloat(this.value);
    seek._dragging = false;
  });

  playBtn.addEventListener('click', function() { toggleAudio(); });
  document.getElementById('audioRew').addEventListener('click', function() {
    audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
  });
  document.getElementById('audioFwd').addEventListener('click', function() {
    audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + 15);
  });

  // Auto-play
  audioEl.play().catch(function(){});
  playBtn.textContent = '⏸';
  playBtn.classList.add('playing');
}

function toggleAudio() {
  var btn = document.getElementById('audioPlayBtn');
  if (audioEl.paused) {
    audioEl.play(); btn.textContent = '⏸'; btn.classList.add('playing');
  } else {
    audioEl.pause(); btn.textContent = '▶'; btn.classList.remove('playing');
  }
}

      showError('Video load timed out. URL: ' + url);
    }
  }, 15000);

  // Seek bar
  seek.addEventListener('mousedown', function(){ seek._dragging = true; });
  seek.addEventListener('touchstart', function(){ seek._dragging = true; });
  seek.addEventListener('input', function() {
    document.getElementById('videoTimeCur').textContent = fmt(parseFloat(this.value));
  });
  seek.addEventListener('change', function() {
    videoEl.currentTime = parseFloat(this.value);
    seek._dragging = false;
  });

  // Mouse move to show scrub bar
  document.getElementById('videoPlayer').addEventListener('mousemove', function() {
    showVideoOverlay();
  });

  playBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleVideo(); });
  document.getElementById('videoRew').addEventListener('click', function(e) {
    e.stopPropagation();
    videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
  });
  document.getElementById('videoFwd').addEventListener('click', function(e) {
    e.stopPropagation();
    videoEl.currentTime = Math.min(videoEl.duration, videoEl.currentTime + 10);
  });
  document.getElementById('videoCCBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    captionsEnabled = !captionsEnabled;
    this.style.opacity = captionsEnabled ? 1 : 0.4;
    if (!captionsEnabled) document.getElementById('captionText').textContent = '';
  });

  // Load captions if URL provided
  if (captionUrl) loadSrtCaptions(captionUrl);

  // Auto-play fullscreen
  videoEl.play().then(function() {
    playBtn.textContent = '⏸'; playBtn.classList.add('playing');
    hideVideoOverlayDelayed();
  }).catch(function(){});
}

function toggleVideo() {
  var btn = document.getElementById('videoPlayBtn');
  if (videoEl.paused) {
    videoEl.play(); btn.textContent = '⏸'; btn.classList.add('playing');
    hideVideoOverlayDelayed();
  } else {
    videoEl.pause(); btn.textContent = '▶'; btn.classList.remove('playing');
    showVideoOverlay();
  }
}

function showVideoOverlay() {
  videoOverlay.classList.add('visible');
  clearTimeout(overlayTimer);
  if (!videoEl.paused) hideVideoOverlayDelayed();
}
function hideVideoOverlayDelayed() {
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(function() {
    if (!videoEl.paused) videoOverlay.classList.remove('visible');
  }, 3500);
}

// ── SRT Caption Parser ──
function loadSrtCaptions(url) {
  fetch(url).then(function(r){ return r.text(); }).then(function(text) {
    captions = parseSrt(text);
  }).catch(function(e){ console.warn('Could not load captions:', e); });
}

function parseSrt(text) {
  var result = [];
  var blocks = text.replace(/\r\n/g, '\n').split('\n\n');
  blocks.forEach(function(block) {
    var lines = block.trim().split('\n');
    if (lines.length < 3) return;
    var timeLine = lines[1];
    var match = timeLine.match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/);
    if (!match) return;
    var start = parseInt(match[1])*3600 + parseInt(match[2])*60 + parseInt(match[3]) + parseInt(match[4])/1000;
    var end = parseInt(match[5])*3600 + parseInt(match[6])*60 + parseInt(match[7]) + parseInt(match[8])/1000;
    var content = lines.slice(2).join('\n').replace(/<[^>]+>/g, '');
    result.push({ start: start, end: end, text: content });
  });
  return result;
}

function updateCaptions(time) {
  if (!captionsEnabled || captions.length === 0) return;
  var el = document.getElementById('captionText');
  var active = captions.find(function(c){ return time >= c.start && time <= c.end; });
  el.textContent = active ? active.text : '';
}

// ══════════════════════════════════════════════
// ══════ GESTURE CONTROLS ════════════════════
// ══════════════════════════════════════════════
var lastTapTime = 0;
var tapTimeout = null;

document.addEventListener('click', function(e) {
  // Don't intercept control button clicks
  if (e.target.closest('.ctrl-btn,.audio-btn,.vid-btn,input[type="range"],button,a,select')) return;

  var now = Date.now();
  if (now - lastTapTime < 350) {
    // Double tap → exit
    clearTimeout(tapTimeout);
    lastTapTime = 0;
    exitPlayer();
    return;
  }
  lastTapTime = now;
  tapTimeout = setTimeout(function() {
    // Single tap → pause/play
    singleTapAction();
  }, 350);
});

function singleTapAction() {
  if (mediaType === 'text') { toggleTts(); }
  else if (mediaType === 'audio') { toggleAudio(); }
  else if (mediaType === 'video') {
    if (videoOverlay.classList.contains('visible') || videoEl.paused) {
      toggleVideo();
    } else {
      showVideoOverlay();
    }
  }
}

function exitPlayer() {
  // Stop all media
  stopTts();
  audioEl.pause();
  videoEl.pause();
  // Notify Android if interface exists
  if (window.AndroidInterface && typeof AndroidInterface.exitMediaPlayer === 'function') {
    AndroidInterface.exitMediaPlayer();
  } else if (window.history.length > 1) {
    window.history.back();
  } else {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#888;font-size:16px">Double-tapped to exit. Close this tab.</div>';
  }
}

// ══════════════════════════════════════════════
// ══════ KEYBOARD SHORTCUTS ══════════════════
// ══════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  var key = e.key;
  if (key === ' ' || key === 'k') { e.preventDefault(); singleTapAction(); }
  else if (key === 'Escape') { exitPlayer(); }
  else if (key === 'ArrowLeft') {
    if (mediaType === 'audio') audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
    else if (mediaType === 'video') videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
  }
  else if (key === 'ArrowRight') {
    if (mediaType === 'audio') audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + 15);
    else if (mediaType === 'video') videoEl.currentTime = Math.min(videoEl.duration, videoEl.currentTime + 10);
  }
  else if (key === 'f' && mediaType === 'video') {
    if (document.fullscreenElement) document.exitFullscreen();
    else videoEl.requestFullscreen().catch(function(){});
  }
  else if (key === 'c' && mediaType === 'video') {
    captionsEnabled = !captionsEnabled;
    document.getElementById('videoCCBtn').style.opacity = captionsEnabled ? 1 : 0.4;
    if (!captionsEnabled) document.getElementById('captionText').textContent = '';
  }
});

// ══════════════════════════════════════════════
// ══════ PLAYLIST MODE ═══════════════════════
// ══════════════════════════════════════════════
var playlistMode = false;
var playlistEntries = [];       // [{title, url, kind, relativePath}]
var playOrder = [];             // array of indexes into playlistEntries
var currentOrderIdx = 0;        // index into playOrder
var shuffleOn = false;
var repeatMode = 'off';         // 'off' | 'all' | 'one'
var playlistName = '';

// URL parameters specific to playlist mode
var playlistPath = params.get('playlist') || '';
var sessionToken = params.get('token') || '';
// "bridge" = load playlist via window.TapMedia (on-glasses, no server).
// Anything else (including unset) = fall back to companion HTTP server.
var playlistSource = (params.get('source') || '').toLowerCase();
// Optional start index (0-based) into the playlist — lets the library hand off
// to the player at the exact track the user clicked.
var playlistStart = parseInt(params.get('start') || '0', 10);
if (!isFinite(playlistStart) || playlistStart < 0) playlistStart = 0;
// Companion server URL. On the glasses, the server binds to 127.0.0.1:19110.
// Override via &server=https://…:19110 if the browser reaches it elsewhere.
var companionBase = params.get('server') || 'https://127.0.0.1:19110';

function restoreShuffleRepeat() {
  try {
    var s = sessionStorage.getItem('player_shuffle');
    var r = sessionStorage.getItem('player_repeat');
    if (s === '1') shuffleOn = true;
    if (r === 'all' || r === 'one') repeatMode = r;
  } catch(e){}
}
function saveShuffleRepeat() {
  try {
    sessionStorage.setItem('player_shuffle', shuffleOn ? '1' : '0');
    sessionStorage.setItem('player_repeat', repeatMode);
  } catch(e){}
}

function initPlaylistMode() {
  playlistMode = true;
  document.getElementById('plBar').classList.add('active');
  restoreShuffleRepeat();

  var shuffleBtn = document.getElementById('plShuffleBtn');
  var repeatBtn = document.getElementById('plRepeatBtn');
  shuffleBtn.addEventListener('click', function() {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('active', shuffleOn);
    rebuildPlayOrder();
    saveShuffleRepeat();
    // Drop focus so :hover/:focus doesn't visually mask .active on touch.
    try { shuffleBtn.blur(); } catch(_){}
  });
  repeatBtn.addEventListener('click', function() {
    repeatMode = (repeatMode === 'off') ? 'all'
               : (repeatMode === 'all') ? 'one' : 'off';
    repeatBtn.textContent = (repeatMode === 'one') ? '🔂' : '🔁';
    repeatBtn.classList.toggle('active', repeatMode !== 'off');
    repeatBtn.title = 'Repeat ' + repeatMode;
    saveShuffleRepeat();
    try { repeatBtn.blur(); } catch(_){}
  });
  shuffleBtn.classList.toggle('active', shuffleOn);
  repeatBtn.textContent = (repeatMode === 'one') ? '🔂' : '🔁';
  repeatBtn.classList.toggle('active', repeatMode !== 'off');
  repeatBtn.title = 'Repeat ' + repeatMode;

  document.getElementById('plPrevBtn').addEventListener('click', playPrev);
  document.getElementById('plNextBtn').addEventListener('click', playNext);
  document.getElementById('plQueueBtn').addEventListener('click', toggleDrawer);
  document.getElementById('plDrawerClose').addEventListener('click', closeDrawer);

  fetchPlaylist();
}

// Hand the parsed playlist into the player. Shared by bridge + HTTP loaders.
function applyPlaylist(data) {
  playlistName = (data && data.name) || 'Playlist';
  playlistEntries = ((data && data.entries) || []).map(function(e) {
    // Two shapes are supported:
    //   • HTTP /api/library/playlist   → { url, title, kind, relativePath }
    //   • TapMedia.parsePlaylist()     → { playUrl, title, kind,
    //                                      resolvedRelativePath, rawPath,
    //                                      isAbsoluteUrl }
    var absUrl = e.playUrl || e.url || '';
    if (absUrl && absUrl.indexOf('/') === 0) {
      // Companion-server relative path — make absolute against the companion.
      absUrl = companionBase + absUrl;
    }
    return {
      title: e.title || '',
      url: absUrl,
      kind: (e.kind || 'OTHER').toLowerCase(),
      relativePath: e.resolvedRelativePath || e.relativePath || e.rawPath || ''
    };
  }).filter(function(e){ return !!e.url; });

  if (playlistEntries.length === 0) {
    showError('Playlist is empty.');
    return;
  }
  document.getElementById('plName').textContent = playlistName;
  rebuildPlayOrder();
  // Clamp requested start index to the available queue and honor it.
  var startIdx = playlistStart;
  if (startIdx >= playOrder.length) startIdx = 0;
  // When shuffle is on, rebuildPlayOrder already put the "current" entry at
  // the front (index 0), so respecting playlistStart only matters in the
  // non-shuffle case. In shuffle mode, playlistStart becomes the "seed"
  // track — find its position in the shuffled order.
  if (shuffleOn) {
    var pos = playOrder.indexOf(startIdx);
    currentOrderIdx = pos >= 0 ? pos : 0;
  } else {
    currentOrderIdx = startIdx;
  }
  renderQueue();
  playAt(currentOrderIdx);
}

function fetchPlaylist() {
  if (!playlistPath) { showError('No playlist specified.'); return; }
  diag('fetchPlaylist  path=' + playlistPath + ' source=' + playlistSource);

  // Prefer the on-glasses bridge when this page is opened from the library
  // (source=bridge), or whenever the bridge is available and we have no
  // companion session token. Falls back to the companion HTTP server
  // otherwise — so the same page works from companion and on-glasses.
  var bridge = window.TapMedia;
  var useBridge = (playlistSource === 'bridge') ||
                  (bridge && typeof bridge.parsePlaylist === 'function' && !sessionToken);
  diag('bridge=' + (bridge ? 'yes' : 'no') + ' useBridge=' + useBridge);
  if (useBridge) {
    if (!bridge || typeof bridge.parsePlaylist !== 'function') {
      showError('Media bridge unavailable.');
      return;
    }
    var data;
    try {
      var raw = bridge.parsePlaylist(playlistPath);
      diag('bridge.parsePlaylist returned ' + (raw ? raw.length : 0) + ' chars');
      data = JSON.parse(raw);
    } catch (e) {
      showError('Could not load playlist: ' + (e && e.message || e));
      return;
    }
    if (data && data.error) { showError(data.error); return; }
    diag('playlist entries=' + (data && data.entries ? data.entries.length : 0));
    applyPlaylist(data);
    return;
  }

  var url = companionBase + '/api/library/playlist?path=' + encodeURIComponent(playlistPath) +
            '&token=' + encodeURIComponent(sessionToken);
  fetch(url, { headers: sessionToken ? { 'X-Session-Token': sessionToken } : {} })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(applyPlaylist)
    .catch(function(e) { showError('Could not load playlist: ' + e.message); });
}

function rebuildPlayOrder() {
  var order = [];
  for (var i = 0; i < playlistEntries.length; i++) order.push(i);
  if (shuffleOn) {
    // Preserve the currently-playing entry at front, shuffle the rest
    var cur = playOrder.length > 0 ? playOrder[currentOrderIdx] : 0;
    order = order.filter(function(i){ return i !== cur; });
    for (var j = order.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = order[j]; order[j] = order[k]; order[k] = t;
    }
    order.unshift(cur);
    currentOrderIdx = 0;
  } else {
    // Unshuffle — keep current track, return to natural order starting from it
    var curEntry = playOrder.length > 0 ? playOrder[currentOrderIdx] : 0;
    currentOrderIdx = curEntry;
  }
  playOrder = order;
  renderQueue();
}

function currentEntry() {
  return playlistEntries[playOrder[currentOrderIdx]] || null;
}

function playAt(orderIdx) {
  if (orderIdx < 0 || orderIdx >= playOrder.length) return;
  currentOrderIdx = orderIdx;
  var entry = currentEntry();
  if (!entry) return;

  // Update the top bar
  document.getElementById('plIdxLabel').textContent =
    (currentOrderIdx + 1) + '/' + playOrder.length;
  document.getElementById('plTrackTitle').textContent = entry.title || 'Track';
  document.getElementById('plPrevBtn').disabled =
    (currentOrderIdx === 0 && repeatMode !== 'all');
  document.getElementById('plNextBtn').disabled =
    (currentOrderIdx >= playOrder.length - 1 && repeatMode !== 'all');

  // Update per-track title displays
  mediaTitle = entry.title || mediaTitle;

  // Switch mode + load track
  if (entry.kind === 'video') {
    switchToVideoMode();
    loadVideoTrack(entry.url, entry.title);
  } else {
    // Default audio (works for audio + unknown)
    switchToAudioMode();
    loadAudioTrack(entry.url, entry.title);
  }

  renderQueue();
}

function playNext() {
  if (playOrder.length === 0) return;
  if (currentOrderIdx + 1 < playOrder.length) {
    playAt(currentOrderIdx + 1);
  } else if (repeatMode === 'all') {
    playAt(0);
  }
}
function playPrev() {
  if (playOrder.length === 0) return;
  // If more than 3s into track, restart instead of prev
  var el = videoPlayerActive() ? videoEl : audioEl;
  if (el && el.currentTime > 3) {
    el.currentTime = 0;
    return;
  }
  if (currentOrderIdx > 0) {
    playAt(currentOrderIdx - 1);
  } else if (repeatMode === 'all') {
    playAt(playOrder.length - 1);
  } else {
    el.currentTime = 0;
  }
}

// ── Mode switching ───────────────────────────────────────────────────
function switchToAudioMode() {
  document.getElementById('videoPlayer').classList.remove('active');
  videoEl.pause();
  document.getElementById('audioPlayer').classList.add('active');
}
function switchToVideoMode() {
  document.getElementById('audioPlayer').classList.remove('active');
  audioEl.pause();
  document.getElementById('videoPlayer').classList.add('active');
}
function videoPlayerActive() {
  return document.getElementById('videoPlayer').classList.contains('active');
}

// ── Track load helpers (re-use listeners set up by init* functions) ──
var _audioInit = false, _videoInit = false;

function loadAudioTrack(url, title) {
  document.getElementById('audioTitle').textContent = title || 'Audio';
  if (!_audioInit) {
    initAudioPlayer(url);  // sets up listeners + loads
    _audioInit = true;
    return;
  }
  audioEl.src = url;
  audioEl.load();
  audioEl.play().then(function() {
    var btn = document.getElementById('audioPlayBtn');
    btn.textContent = '⏸'; btn.classList.add('playing');
  }).catch(function(){});
}
function loadVideoTrack(url, title) {
  document.getElementById('videoTitle').textContent = title || 'Video';
  if (!_videoInit) {
    initVideoPlayer(url);
    _videoInit = true;
    return;
  }
  videoEl.src = url;
  videoEl.load();
  videoEl.play().then(function() {
    var btn = document.getElementById('videoPlayBtn');
    btn.textContent = '⏸'; btn.classList.add('playing');
    hideVideoOverlayDelayed();
  }).catch(function(){});
}

// ── Auto-advance hooks (installed after the regular 'ended' handlers) ──
function installPlaylistEndHooks() {
  audioEl.addEventListener('ended', function() {
    if (!playlistMode) return;
    if (repeatMode === 'one') { audioEl.currentTime = 0; audioEl.play(); return; }
    playNext();
  });
  videoEl.addEventListener('ended', function() {
    if (!playlistMode) return;
    if (repeatMode === 'one') { videoEl.currentTime = 0; videoEl.play(); return; }
    playNext();
  });
}

// ── Queue drawer ─────────────────────────────────────────────────────
function toggleDrawer() {
  document.getElementById('plDrawer').classList.toggle('open');
}
function closeDrawer() {
  document.getElementById('plDrawer').classList.remove('open');
}

function renderQueue() {
  var list = document.getElementById('plQueueList');
  list.innerHTML = '';
  playOrder.forEach(function(origIdx, orderIdx) {
    var entry = playlistEntries[origIdx];
    if (!entry) return;
    var row = document.createElement('div');
    row.className = 'q-item' + (orderIdx === currentOrderIdx ? ' current' : '');
    var kindIcon = entry.kind === 'video' ? '▶' : (entry.kind === 'audio' ? '♪' : '•');
    row.innerHTML =
      '<span class="q-num"></span>' +
      '<span class="q-icon">' + kindIcon + '</span>' +
      '<span class="q-title"></span>';
    row.querySelector('.q-num').textContent = (orderIdx + 1);
    row.querySelector('.q-title').textContent = entry.title || entry.relativePath || 'Track';
    row.addEventListener('click', function() { playAt(orderIdx); closeDrawer(); });
    list.appendChild(row);
  });
}

// ══════════════════════════════════════════════
// ══════ INIT ════════════════════════════════
// ══════════════════════════════════════════════
// TTS on the glasses is routed through Gemini 3.1 via window.TapMedia.speakText().
// The browser SpeechSynthesis API is used only as a fallback when the bridge
// isn't present (e.g., the companion-app web viewer). Never reference the
// speechSynthesis global directly at parse time — RayNeo's WebView doesn't
// expose it and a bare reference throws ReferenceError at script-load, halting
// all subsequent init (including the DOMContentLoaded listener that assigns
// the media <audio>/<video> src).
try {
  if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis &&
      typeof window.speechSynthesis.getVoices === 'function' &&
      window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.addEventListener('voiceschanged', function(){}, { once: true });
  }
} catch (e) { /* speechSynthesis unavailable on this WebView — Gemini bridge handles TTS */ }

function initFromTextContent() {
  // Check the window variable (legacy injection path)
  if (window._textContent && typeof window._textContent === 'string') {
    if (!window._textContent.trim()) { showError('File is empty.'); return true; }
    initTextReader(window._textContent);
    return true;
  }
  return false;
}

function tryPullFromBridge() {
  // Pull text from Android bridge (preferred — no race conditions).
  // The bridge stores text before loading this page, so it's always ready.
  var bridge = window.AndroidInterface || window.MediaInterface;
  if (bridge && typeof bridge.getPendingText === 'function') {
    try {
      var text = bridge.getPendingText();
      if (text && text.trim().length > 0) {
        initTextReader(text);
        return true;
      }
    } catch(e) { console.warn('Bridge getPendingText failed:', e); }
  }
  return false;
}

window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loadingText').textContent = 'Loading ' + mediaType + '...';
  diag('DOMContentLoaded  type=' + mediaType);

  if (mediaType === 'playlist') {
    installPlaylistEndHooks();
    initPlaylistMode();
    return;
  }

  if (mediaType === 'text') {
    // 1. Try pulling text from Android bridge (best — always ready)
    if (tryPullFromBridge()) return;
    // 2. Check if text was already injected into window._textContent
    if (initFromTextContent()) return;
    // 3. If we have a URL (library flow), fetch directly — no need to wait
    //    for a bridge that isn't coming.
    if (mediaUrl) {
      diag('text: fetching ' + mediaUrl.substring(0, 60));
      fetch(mediaUrl).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function(text) {
        if (!text.trim()) { showError('File is empty.'); return; }
        initTextReader(text);
      }).catch(function(e) { showError('Could not load file: ' + e.message); });
      return;
    }
    // 4. No URL and no bridge text yet — poll briefly for injected text
    //    (covers legacy paths that call loadUrl() + inject on load).
    var waitCount = 0;
    var waitTimer = setInterval(function() {
      if (tryPullFromBridge()) { clearInterval(waitTimer); return; }
      if (initFromTextContent()) { clearInterval(waitTimer); return; }
      waitCount++;
      if (waitCount > 30) {
        clearInterval(waitTimer);
        showError('No text content available.');
      }
    }, 100);
    return;

  } else if (!mediaUrl) {
    showError('No media URL provided.');
    return;

  } else if (mediaType === 'audio') {
    initAudioPlayer(mediaUrl);

  } else if (mediaType === 'video') {
    initVideoPlayer(mediaUrl);

  } else {
    showError('Unknown media type: ' + mediaType);
  }
});
</script>
