<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Photos — TapInsight</title>
<style>
/* ─── Tokens ──────────────────────────────────────────────────────── */
:root {
  --bg:           #0a0c10;
  --bg-2:         #14171d;
  --tile:         #1a1e26;
  --tile-hover:   #232833;
  --border:       rgba(255,255,255,0.06);
  --text:         #e6edf3;
  --text-dim:     #8b949e;
  --accent:       #00e5ff;
  --accent-glow:  rgba(0,229,255,0.35);
  --danger:       #ff5b5b;
  --shadow-card:  0 2px 8px rgba(0,0,0,0.4);
  --shadow-lift:  0 8px 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,229,255,0.18);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html,body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; }

/* ─── Header ─────────────────────────────────────────────────────── */
.header {
  position: fixed; inset: 0 0 auto 0;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  background: linear-gradient(180deg, rgba(10,12,16,0.96) 0%, rgba(10,12,16,0.6) 90%, transparent 100%);
  z-index: 10;
}
.header h1 {
  font-size: 18px; font-weight: 600; letter-spacing: 0.2px;
  display: flex; align-items: center; gap: 8px;
}
.header h1 .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
}
.header .meta {
  margin-left: auto; font-size: 12px; color: var(--text-dim);
}
/* Grant-permission banner — full-width card pinned to the top of
   the grid scroll surface. Previously this was a header pill that
   got clipped by the narrow glasses display when meta text grew.
   In the new layout the gallery already works without permission
   for TapInsight's own saves, so the banner is purely "+ also show
   RayNeo Camera photos" — it should be discoverable but not block
   the grid. */
.grant-banner {
  display: none;
  margin: 0 0 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(0,229,255,0.10), rgba(0,229,255,0.03));
  border: 1px solid rgba(0,229,255,0.32);
  align-items: center;
  gap: 12px;
}
.grant-banner.visible { display: flex; }
.grant-banner .gb-text { flex: 1; font-size: 12.5px; line-height: 1.5; }
.grant-banner .gb-title { color: var(--text); font-weight: 600; margin-bottom: 2px; }
.grant-banner .gb-sub { color: var(--text-dim); font-size: 11.5px; }
.grant-banner .gb-btn {
  background: var(--accent); color: #001; border: 0;
  padding: 9px 14px; border-radius: 8px;
  font-weight: 700; font-size: 12px;
  cursor: pointer; flex-shrink: 0;
  box-shadow: 0 0 12px var(--accent-glow);
}
.grant-banner .gb-btn:hover, .grant-banner .gb-btn:active {
  filter: brightness(1.15);
}

/* ─── Grid ───────────────────────────────────────────────────────── */
.grid {
  position: fixed; inset: 56px 0 0 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 12px 24px;
  -webkit-overflow-scrolling: touch;
}
.grid-inner {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.tile {
  position: relative;
  aspect-ratio: 1 / 1;
  background: var(--tile);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.tile:hover, .tile:active {
  background: var(--tile-hover);
  transform: scale(1.02);
  box-shadow: var(--shadow-lift);
}
.tile img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.tile .label {
  position: absolute;
  inset: auto 0 0 0;
  padding: 18px 8px 6px;
  font-size: 10px;
  color: rgba(255,255,255,0.92);
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}
.empty {
  padding: 80px 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
}
.empty .big { font-size: 18px; color: var(--text); margin-bottom: 6px; }

/* ─── Lightbox ────────────────────────────────────────────────────── */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.98);
  display: none;
  z-index: 100;
  touch-action: pan-y;
}
.lightbox.open { display: flex; flex-direction: column; }

.lightbox .top {
  display: flex; align-items: center;
  padding: 14px 18px;
  gap: 10px;
  background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
}
.lightbox .top .filename {
  font-size: 13px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.lightbox .top .index {
  font-size: 13px; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.lightbox .top button {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  font-size: 18px;
}
.lightbox .top button:hover, .lightbox .top button:active {
  background: rgba(255,255,255,0.08);
}

.lightbox .stage {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.lightbox .stage img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  -webkit-user-drag: none;
}

.lightbox .nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.45);
  color: var(--text);
  font-size: 24px;
  transition: background 0.15s;
}
.lightbox .nav:hover, .lightbox .nav:active { background: rgba(0,0,0,0.75); }
.lightbox .nav.prev { left: 12px; }
.lightbox .nav.next { right: 12px; }
.lightbox .nav.disabled { opacity: 0.25; pointer-events: none; }

.lightbox .toolbar {
  display: flex; justify-content: center; align-items: center;
  gap: 12px;
  padding: 14px 18px 20px;
  background: linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
}
.lightbox .toolbar button {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 11px;
  color: var(--text);
  background: rgba(255,255,255,0.06);
  transition: background 0.15s;
  min-width: 64px;
}
.lightbox .toolbar button:hover, .lightbox .toolbar button:active {
  background: rgba(255,255,255,0.14);
}
.lightbox .toolbar button .icon { font-size: 18px; line-height: 1; }
.lightbox .toolbar button.danger:hover, .lightbox .toolbar button.danger:active {
  background: rgba(255, 91, 91, 0.18);
}

.toast {
  position: fixed; left: 50%; bottom: 90px;
  transform: translateX(-50%);
  padding: 10px 18px;
  background: rgba(20, 24, 30, 0.95);
  border: 1px solid var(--border);
  border-radius: 24px;
  font-size: 13px;
  color: var(--text);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1><span class="dot"></span>Photos</h1>
  <div class="meta" id="meta">Loading…</div>
</div>

<div class="grid" id="grid">
  <!-- Permission banner — full-width, sits above the thumbnail grid.
       Only TapInsight's own saves show without permission; this
       banner offers to add RayNeo Camera photos to the gallery
       when the user grants READ_MEDIA_IMAGES. -->
  <div class="grant-banner" id="grantBanner">
    <div class="gb-text">
      <div class="gb-title">Also show RayNeo Camera photos?</div>
      <div class="gb-sub">Your TapInsight saves are already showing below. Grant permission to also include photos from the device's native Camera app.</div>
    </div>
    <button class="gb-btn" id="grantBtn">Grant</button>
  </div>
  <div class="grid-inner" id="gridInner"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="top">
    <button id="closeBtn" aria-label="Close">✕</button>
    <div class="filename" id="lbFilename"></div>
    <div class="index" id="lbIndex"></div>
  </div>
  <div class="stage">
    <button class="nav prev" id="prevBtn" aria-label="Previous">‹</button>
    <img id="lbImage" alt="">
    <button class="nav next" id="nextBtn" aria-label="Next">›</button>
  </div>
  <div class="toolbar">
    <button id="rotLeftBtn" title="Rotate 90° counter-clockwise">
      <span class="icon">↺</span><span>Rotate</span>
    </button>
    <button id="rotRightBtn" title="Rotate 90° clockwise">
      <span class="icon">↻</span><span>Rotate</span>
    </button>
    <button id="infoBtn" title="Show photo details">
      <span class="icon">ⓘ</span><span>Info</span>
    </button>
    <button id="shareBtn" title="Copy image URL to clipboard">
      <span class="icon">🔗</span><span>Copy URL</span>
    </button>
    <button class="danger" id="deleteBtn" title="Delete">
      <span class="icon">🗑</span><span>Delete</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/**
 * TapInsight photos gallery.
 *
 * Data source: the on-glasses WebView attaches a TapMedia
 * JavascriptInterface (see MediaLibraryBridge). We call:
 *   window.TapMedia.listFolder("Photos")   → JSON of entries
 *   window.TapMedia.deleteFile(path)       → boolean
 *
 * Image bytes are served by the asset host at:
 *   https://appassets.androidplatform.net/media/Photos/<filename>
 *
 * URL params:
 *   ?focus=Photos/<filename>   open the lightbox on that photo on load
 */

const MEDIA_BASE = 'https://appassets.androidplatform.net/media/';
const PHOTOS_FOLDER = 'Photos';

const els = {
  meta: document.getElementById('meta'),
  gridInner: document.getElementById('gridInner'),
  grid: document.getElementById('grid'),
  lightbox: document.getElementById('lightbox'),
  lbImage: document.getElementById('lbImage'),
  lbFilename: document.getElementById('lbFilename'),
  lbIndex: document.getElementById('lbIndex'),
  closeBtn: document.getElementById('closeBtn'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  rotLeftBtn: document.getElementById('rotLeftBtn'),
  rotRightBtn: document.getElementById('rotRightBtn'),
  infoBtn: document.getElementById('infoBtn'),
  shareBtn: document.getElementById('shareBtn'),
  deleteBtn: document.getElementById('deleteBtn'),
  grantBanner: document.getElementById('grantBanner'),
  grantBtn: document.getElementById('grantBtn'),
  toast: document.getElementById('toast'),
};

/** @type {Array<{name:string, relativePath:string, sizeBytes:number, lastModifiedMs:number}>} */
let photos = [];
let lightboxIndex = -1;
let rotation = 0;  // accumulated degrees in lightbox (view-only this commit)

function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  setTimeout(() => els.toast.classList.remove('show'), 2200);
}

function mediaUrl(relativePath) {
  if (!relativePath) return '';
  return MEDIA_BASE + relativePath.split('/').map(encodeURIComponent).join('/');
}

/**
 * Resolve the WebView-loadable URL for any photo entry, library or
 * DCIM. The bridge already supplies `fullUrl` (and `thumbnailUrl`)
 * for both sources — library uses /media/<rel>, DCIM uses
 * /dcim/<kind>/<id> — so prefer those when present, falling back to
 * the relativePath path for older bridge builds. Returning '' for an
 * entry with neither lets the caller skip / show a placeholder.
 */
function entryUrl(p) {
  if (!p) return '';
  if (p.fullUrl) return p.fullUrl;
  if (p.relativePath) return mediaUrl(p.relativePath);
  return '';
}

function formatDate(ms) {
  if (!ms) return '';
  try {
    const d = new Date(ms);
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  } catch { return ''; }
}

async function loadPhotos() {
  if (!window.TapMedia) {
    els.meta.textContent = 'TapMedia bridge not available';
    els.gridInner.innerHTML =
      '<div class="empty"><div class="big">Photo library not available</div>' +
      '<div>This page must be opened from the TapInsight glasses.</div></div>';
    return;
  }
  // Prefer listAllPhotos() (merged library + DCIM) when available;
  // fall back to listFolder("Photos") on older builds where only
  // the library scope exists.
  let json;
  try {
    if (typeof window.TapMedia.listAllPhotos === 'function') {
      json = JSON.parse(window.TapMedia.listAllPhotos());
    } else if (typeof window.TapMedia.listFolder === 'function') {
      const folder = JSON.parse(window.TapMedia.listFolder(PHOTOS_FOLDER));
      json = { entries: folder.entries || [], hasMediaPermission: true };
    } else {
      throw new Error('No listing method on TapMedia');
    }
  } catch (e) {
    els.meta.textContent = 'Bridge error';
    els.gridInner.innerHTML =
      '<div class="empty"><div class="big">Could not read Photos</div><div>' +
      String(e) + '</div></div>';
    return;
  }
  if (json.error) {
    els.gridInner.innerHTML =
      '<div class="empty"><div class="big">' + json.error + '</div></div>';
    return;
  }

  const imageKinds = new Set(['IMAGE', 'VIDEO']);
  photos = (json.entries || [])
    .filter(e => imageKinds.has(e.kind))
    .sort((a, b) => (b.lastModifiedMs || 0) - (a.lastModifiedMs || 0));

  const accessMissing = json.hasMediaPermission === false;
  if (!photos.length) {
    els.meta.textContent = '0 photos';
    // The new flow: TapInsight saves go to DCIM/TapInsight via MediaStore
    // and DON'T need permission to read back. So an empty gallery means
    // the user hasn't actually saved any photos yet. The "Grant access"
    // banner above the (currently empty) grid handles the optional add-
    // device-photos path.
    if (accessMissing) {
      els.grantBanner.classList.add('visible');
    }
    els.gridInner.innerHTML =
      '<div class="empty"><div class="big">No photos yet</div>' +
      '<div>Say <i>"save this photo"</i> to TapInsight while the AR camera is active.</div>' +
      '</div>';
    return;
  }
  // Tally TapInsight saves (library OR dcim_own) vs device photos
  // (dcim from other apps). After the MediaStore switch, "own"
  // entries can live in either source — TapInsight's saves now go
  // to DCIM/TapInsight via MediaStore (source=dcim_own), with the
  // app-private Media/Photos (source=library) preserved for any
  // older saves that pre-date the switch.
  const ownCount = photos.filter(p =>
    p.source === 'library' || p.source === 'dcim_own'
  ).length;
  const otherCount = photos.length - ownCount;
  let metaParts = [photos.length + (photos.length === 1 ? ' photo' : ' photos')];
  if (otherCount > 0) {
    metaParts.push(ownCount + ' TapInsight · ' + otherCount + ' device');
  } else if (accessMissing) {
    metaParts.push('device photos hidden');
  }
  els.meta.textContent = metaParts.join(' · ');
  // Show the "+ device photos" banner above the grid whenever the
  // user hasn't granted permission — even if they already have
  // library photos. The banner is purely additive now ("also show
  // RayNeo Camera photos"), so it doesn't block the gallery.
  if (accessMissing) {
    els.grantBanner.classList.add('visible');
  } else {
    els.grantBanner.classList.remove('visible');
  }
  renderGrid();
  maybeFocusFromQuery();
}

// renderAccessBanner was a dynamically-inserted node that competed
// with the static .grant-banner above; the static one is the source
// of truth now and is toggled visible/hidden in loadPhotos.

function requestMediaAccess() {
  if (!window.TapMedia || typeof window.TapMedia.requestMediaPermission !== 'function') {
    toast('Permission request not supported in this build.');
    return;
  }
  let respRaw, resp;
  try {
    respRaw = window.TapMedia.requestMediaPermission();
    resp = JSON.parse(respRaw);
  } catch (e) {
    toast('Permission call failed: ' + String(e));
    return;
  }
  // The bridge returns one of three statuses. Surface each clearly so
  // the user knows whether to wait for the system dialog, whether the
  // grant was already in place (in which case we just reload), or
  // whether something stopped the request from firing.
  if (resp && resp.status === 'alreadyGranted') {
    toast('Already granted — reloading to pick up photos…');
    setTimeout(() => location.reload(), 400);
  } else if (resp && resp.status === 'requested') {
    toast('System dialog opened. Tap Allow on the glasses.');
  } else if (resp && resp.error) {
    toast('Could not open dialog: ' + resp.error);
  } else {
    toast('Permission request response: ' + (respRaw || '(empty)'));
  }
}

function renderGrid() {
  const frag = document.createDocumentFragment();
  photos.forEach((p, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.addEventListener('click', () => openLightbox(i));

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = entryUrl(p);
    img.alt = p.name;
    tile.appendChild(img);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = formatDate(p.lastModifiedMs);
    tile.appendChild(label);

    frag.appendChild(tile);
  });
  els.gridInner.replaceChildren(frag);
}

function maybeFocusFromQuery() {
  const m = location.search.match(/[?&]focus=([^&]+)/);
  if (!m) return;
  const focus = decodeURIComponent(m[1]);
  // Three focus identifier shapes are supported, in order:
  //   "dcim:<id>"          — MediaStore-backed save from CameraTool
  //                          (the new default after the DCIM switch)
  //   "Photos/<filename>"  — legacy library save (Media/Photos folder)
  //   anything else        — string-equal match against relativePath
  //                          for compatibility with older save paths
  let idx = -1;
  if (focus.startsWith('dcim:')) {
    const id = focus.slice(5);
    idx = photos.findIndex(p => p.source && p.source.indexOf('dcim') === 0 &&
                                 String(p.dcimId) === id);
  }
  if (idx < 0) {
    idx = photos.findIndex(p => p.relativePath === focus);
  }
  if (idx >= 0) openLightbox(idx);
}

function openLightbox(idx) {
  if (idx < 0 || idx >= photos.length) return;
  lightboxIndex = idx;
  rotation = 0;
  renderLightbox();
  els.lightbox.classList.add('open');
}

function closeLightbox() {
  els.lightbox.classList.remove('open');
  lightboxIndex = -1;
  rotation = 0;
}

function renderLightbox() {
  const p = photos[lightboxIndex];
  if (!p) return closeLightbox();
  els.lbImage.src = entryUrl(p);
  els.lbImage.style.transform = `rotate(${rotation}deg)`;
  els.lbFilename.textContent = p.name;
  els.lbIndex.textContent = (lightboxIndex + 1) + ' / ' + photos.length;
  els.prevBtn.classList.toggle('disabled', lightboxIndex === 0);
  els.nextBtn.classList.toggle('disabled', lightboxIndex === photos.length - 1);
}

function nav(delta) {
  const newIdx = lightboxIndex + delta;
  if (newIdx < 0 || newIdx >= photos.length) return;
  lightboxIndex = newIdx;
  rotation = 0;
  renderLightbox();
}

async function rotateBy(deg) {
  const p = photos[lightboxIndex];
  if (!p) return;
  // dcim_own (TapInsight's own MediaStore saves) and dcim (other apps')
  // both lack a Media/Photos relativePath, which is what
  // bridge.rotateImage operates on. Since the bridge can't take a
  // MediaStore id yet, both are view-only here. Rotation for own
  // DCIM saves is doable in a future bridge change (open the URI,
  // re-encode, update via resolver), but not today.
  if (p.source === 'dcim' || p.source === 'dcim_own') {
    toast(p.source === 'dcim_own'
      ? 'Rotating MediaStore-backed photos is not yet supported'
      : 'Device-camera photos are view-only here');
    return;
  }

  // Optimistic view-rotate while the disk write runs.
  rotation = (rotation + deg + 360) % 360;
  els.lbImage.style.transform = `rotate(${rotation}deg)`;

  if (!window.TapMedia || typeof window.TapMedia.rotateImage !== 'function') {
    toast('Rotation not persisted (bridge missing)');
    return;
  }
  let resp;
  try {
    resp = JSON.parse(window.TapMedia.rotateImage(p.relativePath, deg));
  } catch (e) {
    toast('Rotation failed: ' + String(e));
    return;
  }
  if (resp && resp.error) {
    toast(resp.error);
    return;
  }
  // After a successful disk write, reset the on-screen transform and
  // bust the image cache so the rotated bytes load fresh.
  rotation = 0;
  els.lbImage.style.transform = 'rotate(0deg)';
  const fresh = entryUrl(p) + '?t=' + Date.now();
  els.lbImage.src = fresh;
  // Also invalidate the corresponding tile thumb in the grid.
  const tileImg = els.gridInner.querySelectorAll('.tile img')[lightboxIndex];
  if (tileImg) tileImg.src = fresh;
  toast('Rotated');
}

async function deletePhoto() {
  const p = photos[lightboxIndex];
  if (!p) return;
  if (p.source === 'dcim_own') {
    toast('Delete TapInsight photos via Files / Photos app (MediaStore delete not yet wired in bridge)');
    return;
  }
  if (p.source === 'dcim') {
    toast('Delete device-camera photos from the RayNeo Camera app');
    return;
  }
  if (!window.TapMedia || typeof window.TapMedia.deleteEntry !== 'function') {
    return toast('Delete not available in this view');
  }
  if (!confirm(`Delete ${p.name}?`)) return;
  let resp = null;
  try { resp = JSON.parse(window.TapMedia.deleteEntry(p.relativePath)); }
  catch (e) { /* swallow */ }
  const ok = resp && resp.status === 'deleted';
  if (!ok) return toast('Delete failed');
  photos.splice(lightboxIndex, 1);
  if (!photos.length) {
    closeLightbox();
    renderGrid();
    els.meta.textContent = '0 photos';
    els.gridInner.innerHTML =
      '<div class="empty"><div class="big">No photos yet</div></div>';
    return;
  }
  if (lightboxIndex >= photos.length) lightboxIndex = photos.length - 1;
  renderGrid();
  renderLightbox();
  els.meta.textContent = photos.length + ' photos';
  toast('Deleted');
}

function copyShareUrl() {
  const p = photos[lightboxIndex];
  if (!p) return;
  const url = entryUrl(p);
  if (!url) return toast('Nothing to share');
  try {
    navigator.clipboard.writeText(url).then(
      () => toast('URL copied'),
      () => fallbackCopy(url)
    );
  } catch { fallbackCopy(url); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('URL copied'); }
  catch { toast('Copy failed — URL: ' + text); }
  finally { document.body.removeChild(ta); }
}

/**
 * "Info" button — shows file metadata in a toast. The previous Download
 * button created an <a download> that pointed at the same-origin asset
 * URL; on the glasses there's no Downloads folder UX, so it just sat
 * there doing nothing useful. Replacing it with an info readout gives
 * the user something to read about the photo (source, dimensions, size,
 * date) without sending them elsewhere. For real cross-device transfers
 * the user can use the companion app's Library tab.
 */
function showInfo() {
  const p = photos[lightboxIndex];
  if (!p) return;
  const parts = [];
  const sourceLabel = p.source === 'dcim'      ? 'RayNeo Camera'
                    : p.source === 'dcim_own'  ? 'TapInsight (DCIM)'
                    : p.source === 'library'   ? 'TapInsight (legacy)'
                    : 'TapInsight';
  parts.push(sourceLabel);
  if (p.width && p.height) parts.push(p.width + '×' + p.height);
  if (p.sizeBytes) {
    const kb = p.sizeBytes / 1024;
    parts.push(kb < 1024 ? Math.round(kb) + ' KB' : (kb / 1024).toFixed(1) + ' MB');
  }
  if (p.lastModifiedMs) parts.push(formatDate(p.lastModifiedMs));
  toast(parts.join(' · '));
}

// ─── Event wiring ───────────────────────────────────────────────
els.closeBtn.addEventListener('click', closeLightbox);
els.prevBtn.addEventListener('click', () => nav(-1));
els.nextBtn.addEventListener('click', () => nav(1));
els.rotLeftBtn.addEventListener('click', () => rotateBy(-90));
els.rotRightBtn.addEventListener('click', () => rotateBy(90));
els.shareBtn.addEventListener('click', copyShareUrl);
els.infoBtn.addEventListener('click', showInfo);
els.deleteBtn.addEventListener('click', deletePhoto);
els.grantBtn.addEventListener('click', requestMediaAccess);

document.addEventListener('keydown', (e) => {
  if (!els.lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') nav(-1);
  else if (e.key === 'ArrowRight') nav(1);
});

// Swipe nav inside the lightbox.
(function attachSwipe() {
  let startX = null, startY = null;
  els.lightbox.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  els.lightbox.addEventListener('touchend', (e) => {
    if (startX === null) return;
    const dx = (e.changedTouches[0].clientX - startX);
    const dy = (e.changedTouches[0].clientY - startY);
    startX = startY = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      nav(dx < 0 ? 1 : -1);
    } else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) {
      closeLightbox();
    }
  });
})();

loadPhotos();
</script>
